name: Sarah 2.2 final authoritative gate v2

on:
  push:
    branches: [agent/sarah-2-2-phone-windows-complete-v13]
    paths:
      - tools/post_finalize_sarah_22_audit_compat.py
      - .github/workflows/sarah-2-2-final-authoritative-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sarah-2-2-final-authoritative-v2
  cancel-in-progress: false

jobs:
  android_and_source:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      SARAH_OPENAI_API_KEY: ${{ secrets.SARAH_OPENAI_API_KEY }}
      SARAH_MODEL_BACKEND_URL: ${{ secrets.SARAH_MODEL_BACKEND_URL }}
      SARAH_MODEL_BACKEND_TOKEN: ${{ secrets.SARAH_MODEL_BACKEND_TOKEN }}
      SARAH_ELEVENLABS_API_KEY: ${{ secrets.SARAH_ELEVENLABS_API_KEY }}
      SARAH_ELEVENLABS_VOICE_ID: ${{ secrets.SARAH_ELEVENLABS_VOICE_ID }}
      SARAH_ELEVENLABS_MODEL_ID: ${{ secrets.SARAH_ELEVENLABS_MODEL_ID }}
      SARAH_ELEVENLABS_BACKEND_URL: ${{ secrets.SARAH_ELEVENLABS_BACKEND_URL }}
      SARAH_ELEVENLABS_BACKEND_TOKEN: ${{ secrets.SARAH_ELEVENLABS_BACKEND_TOKEN }}
      SARAH_TAVILY_API_KEY: ${{ secrets.SARAH_TAVILY_API_KEY }}
      SARAH_STAY22_AID: ${{ secrets.SARAH_STAY22_AID }}
      SARAH_TRAVEL_COMMERCE_URL: ${{ secrets.SARAH_TRAVEL_COMMERCE_URL }}
      SARAH_TRAVEL_COMMERCE_TOKEN: ${{ secrets.SARAH_TRAVEL_COMMERCE_TOKEN }}
      SARAH_VOICE_CONCIERGE_URL: ${{ secrets.SARAH_VOICE_CONCIERGE_URL }}
      SARAH_VOICE_CONCIERGE_TOKEN: ${{ secrets.SARAH_VOICE_CONCIERGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/sarah-2-2-phone-windows-complete-v13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rebuild and audit all recoverable source
        run: |
          mkdir -p final-logs
          {
            python tools/apply_sarah_22_upgrade.py
            python tools/generate_sarah_windows_companion.py
            python tools/finalize_sarah_22_generated_sources.py
            python tools/post_finalize_sarah_22_quality.py
            python tools/post_finalize_sarah_22_sync_dedupe.py
            python tools/post_finalize_sarah_22_audit_compat.py
            python tools/verify_sarah_22_source_contracts.py
            python -m py_compile tools/*.py windows-companion/*.py
            git diff --check
          } 2>&1 | tee final-logs/source.log

      - name: Push complete generated files to the recovery branch
        run: |
          git config user.name "Sarah Travel OS Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish corrected authoritative Sarah 2.2 source"
            git push origin HEAD:agent/sarah-2-2-phone-windows-complete-v13
          fi

      - name: Java contracts
        id: java
        continue-on-error: true
        run: |
          set -o pipefail
          rm -rf build/sarah22-core && mkdir -p build/sarah22-core
          {
            javac -encoding UTF-8 -d build/sarah22-core \
              Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/IdentityIntent.java \
              Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/UniversalCalmSupport.java \
              Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/SarahChannelResponse.java \
              Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/TrustedSyncProtocol.java \
              Sarah_Morgan_Android_Phone_First_v3/tests/Sarah22CoreTest.java
            java -cp build/sarah22-core Sarah22CoreTest
          } 2>&1 | tee final-logs/java.log

      - name: Windows core tests
        id: windows_core
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python -m pip install --upgrade pip
            pip install cryptography Pillow requests pytest
            python -m pytest -q windows-companion/tests
          } 2>&1 | tee final-logs/windows-core.log

      - name: Required ElevenLabs live voice
        id: voice
        continue-on-error: true
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee final-logs/elevenlabs.log
          import json, os, pathlib, re, urllib.parse, urllib.request
          key=os.environ.get('SARAH_ELEVENLABS_API_KEY','').strip()
          if not key:
              raise SystemExit('SARAH_ELEVENLABS_API_KEY is missing')
          voice=os.environ.get('SARAH_ELEVENLABS_VOICE_ID','').strip()
          if not voice:
              source=pathlib.Path('Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/ElevenLabsVoiceConfig.java').read_text(encoding='utf-8')
              for pattern in [r'(?:DEFAULT|SOURCE_DEFAULT|BUILT_IN)[A-Z_]*VOICE[A-Z_]*ID\s*=\s*"([A-Za-z0-9_-]{8,})"',r'VOICE_ID\s*=\s*"([A-Za-z0-9_-]{8,})"',r'"([A-Za-z0-9_-]{18,})"']:
                  match=re.search(pattern,source,re.I)
                  if match: voice=match.group(1); break
          if not voice:
              raise SystemExit('Sarah Morgan ElevenLabs voice ID could not be resolved')
          model=os.environ.get('SARAH_ELEVENLABS_MODEL_ID','').strip() or 'eleven_multilingual_v2'
          body=json.dumps({'text':'Sarah Travel OS final corrected voice validation.','model_id':model,'voice_settings':{'stability':0.55,'similarity_boost':0.78}}).encode()
          request=urllib.request.Request('https://api.elevenlabs.io/v1/text-to-speech/'+urllib.parse.quote(voice),data=body,method='POST',headers={'xi-api-key':key,'Content-Type':'application/json','Accept':'audio/mpeg'})
          with urllib.request.urlopen(request,timeout=90) as response:
              audio=response.read(600000)
              if response.status < 200 or response.status >= 300 or len(audio) < 128: raise SystemExit('ElevenLabs returned no usable audio')
          print('PASS: Sarah Morgan ElevenLabs live voice produced usable audio without printing a credential.')
          PY

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Android APK
        id: android
        continue-on-error: true
        run: |
          set -o pipefail
          {
            gradle -p Sarah_Morgan_Android_Phone_First_v3/android-app :app:assembleDebug --stacktrace
            cp Sarah_Morgan_Android_Phone_First_v3/android-app/app/build/outputs/apk/debug/app-debug.apk Sarah-Morgan-2.2-phone-windows-continuity.apk
          } 2>&1 | tee final-logs/android.log

      - if: steps.android.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Sarah-Morgan-2.2-final-Android-APK
          path: Sarah-Morgan-2.2-phone-windows-continuity.apk
          if-no-files-found: error

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sarah-2.2-final-source-Android-logs
          path: final-logs
          if-no-files-found: error

      - name: Enforce required Android-side gates
        if: always()
        run: |
          echo "Java=${{ steps.java.outcome }} WindowsCore=${{ steps.windows_core.outcome }} Voice=${{ steps.voice.outcome }} Android=${{ steps.android.outcome }}"
          test "${{ steps.java.outcome }}" = success
          test "${{ steps.windows_core.outcome }}" = success
          test "${{ steps.voice.outcome }}" = success
          test "${{ steps.android.outcome }}" = success

  windows_executable:
    if: always()
    needs: android_and_source
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sarah-2-2-phone-windows-complete-v13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and package Sarah Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force final-logs | Out-Null
          python -m pip install --upgrade pip 2>&1 | Tee-Object final-logs\pip.log
          pip install -r windows-companion\requirements.txt 2>&1 | Tee-Object -Append final-logs\pip.log
          python -m pytest -q windows-companion\tests 2>&1 | Tee-Object final-logs\tests.log
          python -m py_compile windows-companion\sarah_core.py windows-companion\sarah_sync_server.py windows-companion\google_drive_backup.py windows-companion\sarah_windows.py 2>&1 | Tee-Object final-logs\compile.log
          Push-Location windows-companion
          pyinstaller --noconfirm --clean --onefile --windowed --name Sarah-Morgan-Windows --collect-all pystray --collect-all PIL sarah_windows.py 2>&1 | Tee-Object ..\final-logs\pyinstaller.log
          Copy-Item README_WINDOWS.md dist\README_WINDOWS.md
          Compress-Archive -Path dist\* -DestinationPath Sarah-Morgan-Windows-2.2.zip -Force
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: Sarah-Morgan-Windows-2.2-final
          path: windows-companion/Sarah-Morgan-Windows-2.2.zip
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sarah-2.2-final-Windows-logs
          path: final-logs
          if-no-files-found: warn

  record:
    if: always()
    needs: [android_and_source, windows_executable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/sarah-2-2-phone-windows-complete-v13
      - name: Record the corrected final status
        run: |
          cat > SARAH_2_2_FINAL_STATUS.md <<EOF
          # Sarah 2.2 corrected final status

          - Source, Android, Java, Windows-core, and required ElevenLabs job: **${{ needs.android_and_source.result }}**
          - Native Windows executable job: **${{ needs.windows_executable.result }}**
          - Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Recorded: **$(date -u +'%Y-%m-%d %H:%M:%S UTC')**
          - Recovery branch: **agent/sarah-2-2-phone-windows-complete-v13**

          All recoverable source, tests, documentation, and build workflows live on the branch even when a validation gate is red. A green result still requires Robert's physical Samsung, desktop, laptop, firewall, microphone, speakers, trusted Wi-Fi, airplane mode, encrypted backup restore, and real trip-planning tests before replacing Sarah 2.1.
          EOF
          git config user.name "Sarah Travel OS Validation"
          git config user.email "actions@users.noreply.github.com"
          git add SARAH_2_2_FINAL_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "Record corrected final Sarah 2.2 status"
            git pull --rebase origin agent/sarah-2-2-phone-windows-complete-v13
            git push origin HEAD:agent/sarah-2-2-phone-windows-complete-v13
          fi
