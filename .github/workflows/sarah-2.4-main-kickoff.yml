name: Start Sarah Repair and Public Release Workflows

on:
  push:
    branches: [ main ]
    paths:
      - 'public-release/2.4/KICKOFF.json'
      - 'public-release/2.5/KICKOFF.json'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-release:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the Sarah 2.5 source materialization workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run sarah-2.5-source-extract.yml \
            --ref main \
            --repo "$GITHUB_REPOSITORY"
