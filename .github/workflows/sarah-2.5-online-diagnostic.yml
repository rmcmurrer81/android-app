name: Sarah 2.5 online mind diagnostic

on:
  push:
    branches:
      - agent/sarah-2.5-event-ready
    paths:
      - .github/ONLINE_DIAGNOSTIC_REQUEST.json

permissions:
  contents: read

concurrency:
  group: sarah-2-5-online-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Require private configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository Actions secret: $name"
              exit 1
            fi
          done

      - name: Install proxy deployment tools
        working-directory: services/sarah-model-proxy
        run: npm install --no-audit --no-fund

      - name: Deploy and distinguish Worker authentication from Workers AI availability or quota
        working-directory: services/sarah-model-proxy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SARAH_MODEL_PROVIDER: workers-ai
          SARAH_MODEL_ID: '@cf/google/gemma-4-26b-a4b-it'
        run: |
          set -euo pipefail
          TOKEN=$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(36))
          PY
          )
          echo "::add-mask::$TOKEN"

          # Wrangler's --secrets-file consumes dotenv syntax. Keeping deployment
          # and verification in one shell also guarantees the exact same token.
          umask 077
          printf 'SARAH_BACKEND_TOKEN=%s\n' "$TOKEN" > /tmp/sarah-diagnostic-secrets.env

          npx wrangler deploy \
            --name sarah-model-proxy-diagnostic \
            --secrets-file /tmp/sarah-diagnostic-secrets.env \
            --var "SARAH_MODEL_PROVIDER:$SARAH_MODEL_PROVIDER" \
            --var "SARAH_MODEL_ID:$SARAH_MODEL_ID" \
            --keep-vars 2>&1 | tee /tmp/deploy.log
          rm -f /tmp/sarah-diagnostic-secrets.env

          BACKEND_URL=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/deploy.log').read_text(encoding='utf-8', errors='replace')
          matches = re.findall(r'https://[A-Za-z0-9.-]+\.workers\.dev', text)
          if not matches:
              raise SystemExit('No workers.dev URL found after deployment.')
          print(matches[-1])
          PY
          )

          echo "Sarah proxy deployed. Waiting briefly for edge propagation."
          sleep 20

          curl --silent --show-error --retry 20 --retry-all-errors --retry-delay 3 \
            "$BACKEND_URL/health" > /tmp/health.json
          python - <<'PY'
          import json
          health = json.load(open('/tmp/health.json', encoding='utf-8'))
          if health.get('ok') is not True:
              raise SystemExit(f"Proxy health failed: {health}")
          print('Proxy health passed.')
          PY

          cat > /tmp/request.json <<'JSON'
          {
            "provider": "workers-ai",
            "model": "@cf/google/gemma-4-26b-a4b-it",
            "system_prompt": "Reply with exactly ONLINE_READY and nothing else.",
            "history": [],
            "message": "Reply with exactly ONLINE_READY.",
            "web_search": false
          }
          JSON

          STATUS=$(curl --silent --show-error \
            -o /tmp/response.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/request.json \
            "$BACKEND_URL/")
          echo "Sarah proxy HTTP status: $STATUS"

          HTTP_STATUS="$STATUS" python - <<'PY'
          import json, os, re
          from pathlib import Path
          status = int(os.environ['HTTP_STATUS'])
          try:
              data = json.loads(Path('/tmp/response.json').read_text(encoding='utf-8'))
          except Exception:
              data = {'error': 'non_json_response'}
          error = str(data.get('error') or '')
          upstream = data.get('upstream_status')
          message = str(data.get('message') or '')
          message = re.sub(r'sk-[A-Za-z0-9_-]+', '[redacted-key]', message)[:300]
          if status == 200:
              reply = str(data.get('reply') or '').strip()
              if reply != 'ONLINE_READY':
                  raise SystemExit(f"Online model authenticated but returned an unexpected test reply: {reply!r}")
              if data.get('provider') != 'workers-ai':
                  raise SystemExit(f"Unexpected provider: {data.get('provider')!r}")
              print('ONLINE_READY: Worker token and Cloudflare Workers AI both passed.')
          else:
              print(f"DIAGNOSTIC_ERROR error={error!r} upstream_status={upstream!r} message={message!r}")
              if error == 'unauthorized':
                  raise SystemExit('The Sarah-to-Worker token was rejected after a same-shell deployment.')
              if error == 'workers_ai_error':
                  raise SystemExit('Cloudflare Workers AI rejected the request; inspect quota/model availability without exposing credentials.')
              raise SystemExit(f"Online model diagnostic failed with HTTP {status}.")
          PY
