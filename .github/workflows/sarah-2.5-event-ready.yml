name: Sarah 2.5 Event Ready APK and EXE

on:
  workflow_dispatch:
  push:
    branches: [agent/sarah-2.5-event-ready]
    paths:
      - 'public-release/2.5/EVENT_READY_KICKOFF.json'
      - '.github/workflows/sarah-2.5-event-ready.yml'
      - 'windows-companion/**'
      - 'Sarah_Morgan_Android_Phone_First_v3/**'

permissions:
  contents: write

concurrency:
  group: sarah-2-5-event-ready
  cancel-in-progress: false

env:
  SARAH_OPENAI_API_KEY: ${{ secrets.SARAH_OPENAI_API_KEY }}
  SARAH_MODEL_BACKEND_URL: ${{ secrets.SARAH_MODEL_BACKEND_URL }}
  SARAH_MODEL_BACKEND_TOKEN: ${{ secrets.SARAH_MODEL_BACKEND_TOKEN }}
  SARAH_TRAVEL_COMMERCE_URL: ${{ secrets.SARAH_TRAVEL_COMMERCE_URL }}
  SARAH_TRAVEL_COMMERCE_TOKEN: ${{ secrets.SARAH_TRAVEL_COMMERCE_TOKEN }}
  SARAH_VOICE_CONCIERGE_URL: ${{ secrets.SARAH_VOICE_CONCIERGE_URL }}
  SARAH_VOICE_CONCIERGE_TOKEN: ${{ secrets.SARAH_VOICE_CONCIERGE_TOKEN }}
  SARAH_ELEVENLABS_API_KEY: ${{ secrets.SARAH_ELEVENLABS_API_KEY }}
  SARAH_ELEVENLABS_VOICE_ID: ${{ secrets.SARAH_ELEVENLABS_VOICE_ID }}
  SARAH_ELEVENLABS_MODEL_ID: ${{ secrets.SARAH_ELEVENLABS_MODEL_ID }}
  SARAH_ELEVENLABS_BACKEND_URL: ${{ secrets.SARAH_ELEVENLABS_BACKEND_URL }}
  SARAH_ELEVENLABS_BACKEND_TOKEN: ${{ secrets.SARAH_ELEVENLABS_BACKEND_TOKEN }}
  SARAH_TAVILY_API_KEY: ${{ secrets.SARAH_TAVILY_API_KEY }}
  SARAH_STAY22_AID: ${{ secrets.SARAH_STAY22_AID }}
  SARAH_STAY22_BACKEND_URL: ${{ secrets.SARAH_STAY22_BACKEND_URL }}
  SARAH_STAY22_BACKEND_TOKEN: ${{ secrets.SARAH_STAY22_BACKEND_TOKEN }}

jobs:
  android:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out the event-ready source
        uses: actions/checkout@v5
        with:
          ref: agent/sarah-2.5-event-ready
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile and test Sarah's Windows core on Linux
        shell: bash
        working-directory: windows-companion
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pytest -q tests
          python -m compileall -q .
          python sarah_event_ready.py --self-test

      - name: Test Sarah identity, calm support, channels, and trusted sync contracts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/sarah25-core
          mkdir -p build/sarah25-core
          javac -encoding UTF-8 -d build/sarah25-core \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/IdentityIntent.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/UniversalCalmSupport.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/SarahChannelResponse.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/TrustedSyncProtocol.java \
            Sarah_Morgan_Android_Phone_First_v3/tests/Sarah22CoreTest.java
          java -cp build/sarah25-core Sarah22CoreTest

      - name: Verify the public build contains no provider credential prompts or committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'apiKeyInput|Personal connected-model API key|Enter your (OpenAI|Claude|Anthropic|ElevenLabs|Tavily|Stay22) API key' \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main windows-companion; then
            echo 'A public provider-credential prompt was found.'
            exit 1
          fi
          if grep -RniE --exclude-dir=.git --exclude='*.md' --exclude='*.txt' \
            '(sk-[A-Za-z0-9_-]{20,}|tvly-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' \
            Sarah_Morgan_Android_Phone_First_v3 windows-companion; then
            echo 'A credential-like value was found in the public source.'
            exit 1
          fi

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Sarah Android 2.5
        shell: bash
        run: |
          set -euo pipefail
          gradle -p Sarah_Morgan_Android_Phone_First_v3/android-app :app:assembleDebug --stacktrace
          cp Sarah_Morgan_Android_Phone_First_v3/android-app/app/build/outputs/apk/debug/app-debug.apk \
            Sarah-Morgan-2.5-event-ready.apk
          test -s Sarah-Morgan-2.5-event-ready.apk

      - name: Verify the APK's real internal version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('Sarah_Morgan_Android_Phone_First_v3/android-app/app/build/outputs/apk/debug/output-metadata.json').read_text(encoding='utf-8'))
          element = metadata['elements'][0]
          version_name = element.get('versionName')
          version_code = element.get('versionCode')
          if version_name != '2.5-event-ready' or version_code != 25:
              raise SystemExit(f'Wrong APK version: {version_name} / {version_code}')
          print('Verified APK version:', version_name, version_code)
          PY
          unzip -t Sarah-Morgan-2.5-event-ready.apk >/dev/null
          sha256sum Sarah-Morgan-2.5-event-ready.apk

      - name: Upload the genuine Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Sarah-Morgan-2.5-Android-APK
          path: Sarah-Morgan-2.5-event-ready.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Build and self-test one Windows installer EXE
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Check out the event-ready source
        uses: actions/checkout@v5
        with:
          ref: agent/sarah-2.5-event-ready
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows-companion/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        working-directory: windows-companion
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Windows source tests and event-ready self-test
        shell: pwsh
        working-directory: windows-companion
        run: |
          python -m pytest -q tests
          python -m compileall -q .
          python sarah_event_ready.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Sarah source self-test failed.' }

      - name: Build the installed Sarah application payload
        shell: pwsh
        working-directory: windows-companion
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name SarahTravelOS `
            --collect-all pystray `
            --collect-all PIL `
            --collect-all playsound3 `
            --hidden-import googleapiclient.discovery `
            --hidden-import google_auth_oauthlib.flow `
            sarah_event_ready.py
          if (!(Test-Path 'dist\SarahTravelOS.exe')) { throw 'SarahTravelOS.exe was not created.' }

      - name: Build the one-file public installer
        shell: pwsh
        working-directory: windows-companion
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name SarahMorganTravelOS-Setup `
            --add-binary 'dist\SarahTravelOS.exe;payload' `
            sarah_installer.py
          if (!(Test-Path 'dist\SarahMorganTravelOS-Setup.exe')) { throw 'SarahMorganTravelOS-Setup.exe was not created.' }

      - name: Self-test the exact public installer
        shell: pwsh
        working-directory: windows-companion
        run: |
          & '.\dist\SarahMorganTravelOS-Setup.exe' --self-test
          if ($LASTEXITCODE -ne 0) { throw "Installer self-test returned $LASTEXITCODE." }
          $file = Get-Item '.\dist\SarahMorganTravelOS-Setup.exe'
          if ($file.Length -lt 1000000) { throw 'The Windows installer is unexpectedly small.' }
          $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'The Windows file is not a PE executable.' }
          Get-FileHash $file.FullName -Algorithm SHA256 | Format-List

      - name: Upload the one-file Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Sarah-Morgan-2.5-Windows-Installer
          path: windows-companion/dist/SarahMorganTravelOS-Setup.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish one APK and one EXE
    if: always() && needs.android.result == 'success' && needs.windows.result == 'success'
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check out release notes
        uses: actions/checkout@v5
        with:
          ref: agent/sarah-2.5-event-ready

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: Sarah-Morgan-2.5-Android-APK
          path: release

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Sarah-Morgan-2.5-Windows-Installer
          path: release

      - name: Verify the release contains exactly the intended installers
        shell: bash
        run: |
          set -euo pipefail
          test -s release/Sarah-Morgan-2.5-event-ready.apk
          test -s release/SarahMorganTravelOS-Setup.exe
          find release -maxdepth 1 -type f -print | sort
          sha256sum release/Sarah-Morgan-2.5-event-ready.apk release/SarahMorganTravelOS-Setup.exe > release/SHA256SUMS.txt

      - name: Publish the event-ready GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='sarah-travel-os-v2.5-event-ready'
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          cat > /tmp/release-notes.md <<'EOF'
          ## Sarah Travel OS 2.5 — event-ready physical-test release

          Download only the file for the device you are installing:

          - **Android phone:** `Sarah-Morgan-2.5-event-ready.apk`
          - **Windows desktop or laptop:** `SarahMorganTravelOS-Setup.exe`

          The APK is internally versioned 2.5, and the Windows file is a genuine self-installing PE executable. Automated source, Android, Windows, encryption, approval-gate, installer, and self-tests passed before publication.

          Sarah uses a compact futuristic logo and gives the screen to useful maps, public photo previews, routes, trips, photos, conversation, and device state. On private Wi-Fi she may notice another Sarah installation, but nothing transfers until the already-running Windows device displays the same six-digit code and explicitly approves the named phone. The first sync and later syncs move approved information in both directions.

          This remains a prerelease only until Robert completes the physical Samsung, desktop/laptop, microphone, speaker, firewall, offline, and two-device synchronization tests.
          EOF
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target agent/sarah-2.5-event-ready \
            --title 'Sarah Travel OS 2.5 — Event Ready' \
            --notes-file /tmp/release-notes.md \
            --prerelease \
            release/Sarah-Morgan-2.5-event-ready.apk \
            release/SarahMorganTravelOS-Setup.exe \
            release/SHA256SUMS.txt

  report:
    name: Record release result on the branch
    if: always()
    needs: [android, windows, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the event-ready branch
        uses: actions/checkout@v5
        with:
          ref: agent/sarah-2.5-event-ready
          fetch-depth: 0

      - name: Commit a machine-readable release status
        shell: bash
        env:
          ANDROID_RESULT: ${{ needs.android.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p public-release/2.5
          cat > public-release/2.5/EVENT_READY_STATUS.json <<EOF
          {
            "run_id": "$RUN_ID",
            "source_sha": "$SOURCE_SHA",
            "android": "$ANDROID_RESULT",
            "windows": "$WINDOWS_RESULT",
            "publish": "$PUBLISH_RESULT",
            "release_tag": "sarah-travel-os-v2.5-event-ready"
          }
          EOF
          git config user.name 'Sarah Event Ready Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add public-release/2.5/EVENT_READY_STATUS.json
          if git diff --cached --quiet; then
            echo 'Release status did not change.'
          else
            git commit -m '[skip ci] Record Sarah 2.5 event-ready release result'
            git push origin HEAD:agent/sarah-2.5-event-ready
          fi
