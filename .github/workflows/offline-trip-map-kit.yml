name: Offline Trip Map Kit

on:
  pull_request:
    paths:
      - "OFFLINE_TRIP_MAP_UI_AND_SCRAPER_INTEGRATION.md"
      - "integration/offline-trip-map-kit/**"
      - ".github/workflows/offline-trip-map-kit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate offline trip map kit
        working-directory: integration/offline-trip-map-kit
        run: npm test
