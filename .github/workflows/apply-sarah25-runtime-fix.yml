name: Apply Sarah 2.5 runtime repair bundle

on:
  push:
    branches: [agent/sarah-2.5-event-ready]
    paths:
      - '.github/sarah25-runtime-fix/READY'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct and apply the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/sarah25-runtime-fix/part-*.txt | base64 --decode > /tmp/sarah25-runtime-fix.patch
          git apply --check /tmp/sarah25-runtime-fix.patch
          git apply --whitespace=fix /tmp/sarah25-runtime-fix.patch
          git diff --check

      - name: Run Sarah 2.5 pure-Java regression contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT='Sarah_Morgan_Android_Phone_First_v3'
          SRC="$ROOT/android-app/app/src/main/java/com/kiraworld/sarahtravel"
          rm -rf build/sarah25-runtime && mkdir -p build/sarah25-runtime
          javac -encoding UTF-8 -d build/sarah25-runtime \
            "$SRC/IdentityIntent.java" \
            "$SRC/UniversalCalmSupport.java" \
            "$SRC/SarahChannelResponse.java" \
            "$SRC/TrustedSyncProtocol.java" \
            "$SRC/KnownEventCatalog.java" \
            "$SRC/DestinationParser.java" \
            "$SRC/TravelContextResolver.java" \
            "$SRC/GenericEventReference.java" \
            "$SRC/OwnerIdentity.java" \
            "$SRC/PublicQuestionIntent.java" \
            "$ROOT/tests/Sarah22CoreTest.java" \
            "$ROOT/tests/Sarah25ConversationContextTest.java"
          java -cp build/sarah25-runtime Sarah22CoreTest
          java -cp build/sarah25-runtime Sarah25ConversationContextTest

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile the repaired Android application
        run: gradle -p Sarah_Morgan_Android_Phone_First_v3/android-app :app:assembleDebug --stacktrace

      - name: Commit only the reviewed source repair and remove the temporary carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/sarah25-runtime-fix
          rm -f .github/workflows/apply-sarah25-runtime-fix.yml
          git config user.name 'Sarah Runtime Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m '[skip ci] Repair Sarah online routing, owner identity, keyboard layout, and demo UI'
          git push origin HEAD:agent/sarah-2.5-event-ready
