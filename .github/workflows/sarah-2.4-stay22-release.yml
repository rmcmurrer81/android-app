name: Sarah 2.4 Stay22 Public Release

on:
  push:
    branches:
      - 'agent/sarah-2.4-stay22-live'
    paths:
      - 'public-release/2.4/READY.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sarah-2-4-stay22-${{ github.ref }}
  cancel-in-progress: false

env:
  SARAH_OPENAI_API_KEY: ${{ secrets.SARAH_OPENAI_API_KEY }}
  SARAH_MODEL_BACKEND_URL: ${{ secrets.SARAH_MODEL_BACKEND_URL }}
  SARAH_MODEL_BACKEND_TOKEN: ${{ secrets.SARAH_MODEL_BACKEND_TOKEN }}
  SARAH_TRAVEL_COMMERCE_URL: ${{ secrets.SARAH_TRAVEL_COMMERCE_URL }}
  SARAH_TRAVEL_COMMERCE_TOKEN: ${{ secrets.SARAH_TRAVEL_COMMERCE_TOKEN }}
  SARAH_VOICE_CONCIERGE_URL: ${{ secrets.SARAH_VOICE_CONCIERGE_URL }}
  SARAH_VOICE_CONCIERGE_TOKEN: ${{ secrets.SARAH_VOICE_CONCIERGE_TOKEN }}
  SARAH_ELEVENLABS_API_KEY: ${{ secrets.SARAH_ELEVENLABS_API_KEY }}
  SARAH_ELEVENLABS_VOICE_ID: ${{ secrets.SARAH_ELEVENLABS_VOICE_ID }}
  SARAH_ELEVENLABS_MODEL_ID: ${{ secrets.SARAH_ELEVENLABS_MODEL_ID }}
  SARAH_ELEVENLABS_BACKEND_URL: ${{ secrets.SARAH_ELEVENLABS_BACKEND_URL }}
  SARAH_ELEVENLABS_BACKEND_TOKEN: ${{ secrets.SARAH_ELEVENLABS_BACKEND_TOKEN }}
  SARAH_TAVILY_API_KEY: ${{ secrets.SARAH_TAVILY_API_KEY }}
  SARAH_STAY22_BACKEND_URL: ${{ secrets.SARAH_STAY22_BACKEND_URL }}
  SARAH_STAY22_BACKEND_TOKEN: ${{ secrets.SARAH_STAY22_BACKEND_TOKEN }}
  SARAH_STAY22_AID: ${{ secrets.SARAH_STAY22_AID }}

jobs:
  materialize-test-build-android:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
    steps:
      - name: Check out Sarah source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Assemble and verify complete Sarah 2.4 source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find public-release/2.4/parts -maxdepth 1 -type f -name 'part-*.txt' | sort)
          if [ "${#parts[@]}" -lt 2 ]; then
            echo 'The complete Sarah 2.4 source parts are not present.'
            exit 1
          fi
          cat "${parts[@]}" > /tmp/Sarah_Travel_OS_2.4_Stay22_Public_Source.zip.b64
          base64 --decode /tmp/Sarah_Travel_OS_2.4_Stay22_Public_Source.zip.b64 > /tmp/Sarah_Travel_OS_2.4_Stay22_Public_Source.zip
          EXPECTED=$(cut -d' ' -f1 public-release/2.4/SOURCE_SHA256.txt)
          ACTUAL=$(sha256sum /tmp/Sarah_Travel_OS_2.4_Stay22_Public_Source.zip | cut -d' ' -f1)
          test "$EXPECTED" = "$ACTUAL"
          rm -rf /tmp/sarah24_source
          unzip -q /tmp/Sarah_Travel_OS_2.4_Stay22_Public_Source.zip -d /tmp
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('/tmp/sarah24_source')
          status = json.loads((root / 'PUBLIC_RELEASE.json').read_text(encoding='utf-8'))
          if status.get('version') != '2.4-stay22-live-public':
              raise SystemExit('Unexpected Sarah source version')
          required = [
              root / 'windows-companion' / 'SarahMorganInstaller.spec',
              root / 'android-upgrade' / 'apply_android_upgrade.py',
              root / 'stay22-proxy' / 'worker.js',
              root / 'docs' / 'STAY22_GOLD_SPONSOR_INTEGRATION.md',
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit('Missing required Sarah source: ' + ', '.join(missing))
          print('Sarah source verified:', len([p for p in root.rglob('*') if p.is_file()]), 'files')
          PY

      - name: Materialize readable phone, Windows, documentation, and proxy source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=/tmp/sarah24_source
          rm -rf windows-companion development-tools/sarah-2.4-android-upgrade docs/sarah-2.4 services/stay22-proxy
          cp -a "$SOURCE/windows-companion" ./windows-companion
          mkdir -p development-tools docs/sarah-2.4 services
          cp -a "$SOURCE/android-upgrade" development-tools/sarah-2.4-android-upgrade
          cp -a "$SOURCE/docs/." docs/sarah-2.4/
          cp -a "$SOURCE/stay22-proxy" services/stay22-proxy
          cp "$SOURCE/README_FIRST.md" README_SARAH_2_4_PUBLIC.md
          cp "$SOURCE/PACKAGE_STATUS.json" SARAH_2_4_PACKAGE_STATUS.json
          cp "$SOURCE/PUBLIC_RELEASE.json" SARAH_PUBLIC_RELEASE.json
          cp "$SOURCE/SOURCE_MANIFEST_SHA256.txt" docs/sarah-2.4/SOURCE_MANIFEST_SHA256.txt
          cp "$SOURCE/windows-companion/github-workflows/build-windows-companion.yml" .github/workflows/build-windows-companion.yml
          python development-tools/sarah-2.4-android-upgrade/apply_android_upgrade.py "$GITHUB_WORKSPACE"
          rm -rf .sarah-upgrade-backup
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Run Windows public-source tests on Ubuntu
        working-directory: windows-companion
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          python -m compileall -q .

      - name: Run Android 2.4 pure-Java tests
        run: python development-tools/sarah-2.4-android-upgrade/run_android_upgrade_tests.py

      - name: Verify public identity, privacy, and Stay22 source boundaries
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE --exclude-dir=tests --exclude='*.md' --exclude='*.txt' --exclude='*.json' \
            '(Robert|McMurrer|Newark|robertmcmurrer)' \
            windows-companion/sarah_core \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel \
            services/stay22-proxy; then
            echo 'A private owner-specific default was found in public production source.'
            exit 1
          fi
          if grep -RniE --exclude='*.b64' --exclude-dir=.git --exclude-dir=tests \
            '(sk-[A-Za-z0-9_-]{20,}|tvly-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|xi-api-key[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{16,})' \
            windows-companion development-tools/sarah-2.4-android-upgrade services/stay22-proxy \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main; then
            echo 'A credential-like value was found in public source.'
            exit 1
          fi
          if grep -RniE 'apiKeyInput|Personal connected-model API key|Enter your (OpenAI|Claude|Anthropic|ElevenLabs|Tavily|Stay22) API key' \
            windows-companion/sarah_core Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main; then
            echo 'The public product asks users for a provider credential.'
            exit 1
          fi
          grep -q 'MAX_CACHE_MILLIS = 60L \* 60L \* 1000L' \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/Stay22AccommodationCore.java
          grep -q 'min(3600' windows-companion/sarah_core/research.py
          grep -q 'supplier-unreachable' windows-companion/sarah_core/research.py
          grep -q 'supplier-unreachable' Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/Stay22AccommodationCore.java

      - name: Commit complete readable Sarah 2.4 source to the branch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sarah 2.4 Public Release Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Readable Sarah 2.4 source was already materialized.'
          else
            git commit -m '[skip ci] Materialize Sarah 2.4 public phone and Windows source'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Sarah Android 2.4 APK
        run: gradle -p Sarah_Morgan_Android_Phone_First_v3/android-app :app:assembleDebug --stacktrace

      - name: Name and verify Android artifact
        shell: bash
        run: |
          cp Sarah_Morgan_Android_Phone_First_v3/android-app/app/build/outputs/apk/debug/app-debug.apk Sarah-Morgan-2.4-stay22-live-public.apk
          test -s Sarah-Morgan-2.4-stay22-live-public.apk
          sha256sum Sarah-Morgan-2.4-stay22-live-public.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Sarah-Morgan-Android-2.4-Stay22-Public
          path: Sarah-Morgan-2.4-stay22-live-public.apk
          if-no-files-found: error

      - name: Upload verified public source archive
        uses: actions/upload-artifact@v4
        with:
          name: Sarah-Travel-OS-2.4-Public-Source
          path: /tmp/Sarah_Travel_OS_2.4_Stay22_Public_Source.zip
          if-no-files-found: error

  build-windows-installer:
    needs: materialize-test-build-android
    runs-on: windows-latest
    steps:
      - name: Check out materialized Sarah 2.4 source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.materialize-test-build-android.outputs.source_sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            windows-companion/requirements.txt
            windows-companion/requirements-build.txt

      - name: Install runtime and build dependencies
        working-directory: windows-companion
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: Run Windows tests and compile source
        working-directory: windows-companion
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q .

      - name: Build Sarah application payload
        working-directory: windows-companion
        run: python -m PyInstaller --noconfirm --clean SarahMorganWindows.spec

      - name: Build one self-installing Sarah EXE
        working-directory: windows-companion
        run: python -m PyInstaller --noconfirm --clean SarahMorganInstaller.spec

      - name: Self-test the public installer
        shell: pwsh
        run: |
          $file = 'windows-companion\dist\SarahMorganTravelOS-Setup.exe'
          if (!(Test-Path $file)) { throw 'SarahMorganTravelOS-Setup.exe was not created.' }
          & $file --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Sarah installer payload self-test failed.' }
          Get-FileHash $file -Algorithm SHA256 | Format-List

      - name: Upload exactly one public Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Sarah-Morgan-Windows-2.4-Stay22-Public-Installer
          path: windows-companion/dist/SarahMorganTravelOS-Setup.exe
          if-no-files-found: error

  publish-prerelease:
    needs: [materialize-test-build-android, build-windows-installer]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: sarah-travel-os-v2.4-stay22-preview
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: Sarah-Morgan-Android-2.4-Stay22-Public
          path: release

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: Sarah-Morgan-Windows-2.4-Stay22-Public-Installer
          path: release

      - name: Download source archive
        uses: actions/download-artifact@v4
        with:
          name: Sarah-Travel-OS-2.4-Public-Source
          path: release

      - name: Verify exactly one APK, one EXE, and one source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release -type f -name '*.apk' | wc -l)" -eq 1
          test "$(find release -type f -name '*.exe' | wc -l)" -eq 1
          test "$(find release -type f -name '*Source.zip' | wc -l)" -eq 1
          find release -maxdepth 2 -type f -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt

      - name: Publish or refresh Sarah 2.4 GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          FILES=(release/*.apk release/*.exe release/*Source.zip release/SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --title 'Sarah Travel OS 2.4 — Stay22 live public preview' \
              --notes 'Full public phone and Windows preview. Includes live Stay22 accommodation search, public one-EXE Windows installation, Android APK, complete source, and checksums. Physical device and live-account acceptance testing are still required.' \
              --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${FILES[@]}" \
              --target '${{ needs.materialize-test-build-android.outputs.source_sha }}' \
              --title 'Sarah Travel OS 2.4 — Stay22 live public preview' \
              --notes 'Full public phone and Windows preview. Includes live Stay22 accommodation search, public one-EXE Windows installation, Android APK, complete source, and checksums. Physical device and live-account acceptance testing are still required.' \
              --prerelease --repo "$GITHUB_REPOSITORY"
          fi
