          if-no-files-found: error

  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows-companion/requirements.txt
      - name: Test Windows source
        shell: pwsh
        working-directory: windows-companion
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pytest -q tests
          python -m compileall -q .
          python sarah_event_ready.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Source self-test failed.' }
      - name: Build Sarah application and one-file installer
        shell: pwsh
        working-directory: windows-companion
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SarahTravelOS-R3-Candidate --add-data 'assets\sarah_adult_portrait_r2_runtime_512.png;assets' --collect-all pystray --collect-all PIL --collect-all playsound3 --hidden-import miniaudio --hidden-import googleapiclient.discovery --hidden-import google_auth_oauthlib.flow --hidden-import google.oauth2.credentials --hidden-import google.auth.transport.requests --hidden-import sarah_wallet --hidden-import sarah_calendar sarah_event_ready.py
          if ($LASTEXITCODE -ne 0) { throw 'Sarah application build failed.' }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SarahMorganTravelOS-R3-Candidate-Setup --add-binary 'dist\SarahTravelOS-R3-Candidate.exe;payload' sarah_installer.py
          if ($LASTEXITCODE -ne 0) { throw 'Sarah installer build failed.' }
          if (!(Test-Path 'dist\SarahMorganTravelOS-R3-Candidate-Setup.exe')) { throw 'Installer was not created.' }
      - name: Self-test the exact public EXE
        shell: pwsh
        working-directory: windows-companion
        run: |
          $process = Start-Process -FilePath '.\dist\SarahMorganTravelOS-R3-Candidate-Setup.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer self-test returned $($process.ExitCode)." }
          $file=Get-Item '.\dist\SarahMorganTravelOS-R3-Candidate-Setup.exe'
          if ($file.Length -lt 1000000) { throw 'Installer is unexpectedly small.' }
          $bytes=[System.IO.File]::ReadAllBytes($file.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Not a PE executable.' }
      - name: Label the PR build as engineering evidence, not the owner voice test
        shell: pwsh
        working-directory: windows-companion
        run: |
          Copy-Item -LiteralPath '.\dist\SarahMorganTravelOS-R3-Candidate-Setup.exe' -Destination '.\dist\SarahMorganTravelOS-2.5-R3-CURRENT-ENGINEERING-EVIDENCE-DO-NOT-INSTALL.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: Sarah-2.5-R3-CURRENT-ENGINEERING-EVIDENCE-DO-NOT-INSTALL-Windows
          path: |
            windows-companion/dist/SarahMorganTravelOS-2.5-R3-CURRENT-ENGINEERING-EVIDENCE-DO-NOT-INSTALL.exe
            docs/SARAH_WINDOWS_ARTIFACT_LINEAGE_20260808.md
          if-no-files-found: error
