name: Sarah 2.5 observable validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  SARAH_OPENAI_API_KEY: ''
  SARAH_MODEL_PROVIDER: workers-ai
  SARAH_MODEL_ID: '@cf/google/gemma-4-26b-a4b-it'
  # Pull-request validation must never expose or package repository secrets.
  # The separately gated online-judge workflow deploys the protected Worker,
  # smoke-tests it, and bundles only non-secret route/model/voice identity.
  # A confirmed owner supplies revocable Sarah access after installation.
  SARAH_MODEL_BACKEND_URL: ''
  SARAH_MODEL_BACKEND_TOKEN: ''
  SARAH_TRAVEL_COMMERCE_URL: ''
  SARAH_TRAVEL_COMMERCE_TOKEN: ''
  SARAH_VOICE_CONCIERGE_URL: ''
  SARAH_VOICE_CONCIERGE_TOKEN: ''
  SARAH_ELEVENLABS_API_KEY: ''
  SARAH_ELEVENLABS_VOICE_ID: ''
  SARAH_ELEVENLABS_MODEL_ID: eleven_flash_v2_5
  SARAH_ELEVENLABS_BACKEND_URL: ''
  SARAH_ELEVENLABS_BACKEND_TOKEN: ''
  SARAH_TAVILY_API_KEY: ''
  SARAH_STAY22_AID: ''
  SARAH_STAY22_BACKEND_URL: ''
  SARAH_STAY22_BACKEND_TOKEN: ''

jobs:
  android-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Protected online-mind source contract
        run: |
          cd services/sarah-model-proxy
          npm install --no-audit --no-fund
          npm run check
          cd ../..
          grep -Fq "SARAH_MODEL_PROVIDER" Sarah_Morgan_Android_Phone_First_v3/android-app/app/build.gradle
          grep -Fq "BuildConfig.SARAH_MODEL_ID" Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/SarahModelConfig.java
          grep -Fq '"binding": "AI"' services/sarah-model-proxy/wrangler.jsonc
          grep -Fq "SARAH_BACKEND_TOKEN" services/sarah-model-proxy/src/index.js
          grep -Fq "WORKER_CONTRACT_VERSION" services/sarah-model-proxy/src/index.js
          grep -Fq "EXPECTED_DEPLOYMENT_ID" .github/workflows/sarah-2.5-online-judge-build.yml
          grep -Fq "EXPECTED_SOURCE_SHA256" .github/workflows/sarah-2.5-online-judge-build.yml
          grep -Fq "EXPECTED_CONFIG_SHA256" .github/workflows/sarah-2.5-online-judge-build.yml
      - name: Windows core and approval-gate tests
        shell: pwsh
        working-directory: windows-companion
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed.' }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Windows dependencies failed to install.' }
          python -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { throw 'Windows source tests failed.' }
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw 'Windows source compilation failed.' }
          python sarah_event_ready.py --self-test
      - name: Android pure-Java contracts
        run: |
          python Sarah_Morgan_Android_Phone_First_v3/tests/validate_package.py
          python -B Sarah_Morgan_Android_Phone_First_v3/tests/test_windows_artifact_lineage.py -v
          python -B Sarah_Morgan_Android_Phone_First_v3/tests/test_event_trip_store_contract.py -v
          python -B Sarah_Morgan_Android_Phone_First_v3/tests/test_runtime_privacy_contracts.py -v
          python -B Sarah_Morgan_Android_Phone_First_v3/tests/test_artifact_credential_boundary.py -v
          python -B Sarah_Morgan_Android_Phone_First_v3/tests/test_android_presence_surface.py -v
          python -B Sarah_Morgan_Android_Phone_First_v3/tests/test_online_owner_activation_contract.py -v
          python -B Sarah_Morgan_Android_Phone_First_v3/tests/test_secure_sync_contract.py -v
          python -B Sarah_Morgan_Android_Phone_First_v3/tests/test_ticket_pass_wallet_contract.py -v
          rm -rf build/sarah25-core && mkdir -p build/sarah25-core
          javac -encoding UTF-8 -d build/sarah25-core \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/IdentityIntent.java \
