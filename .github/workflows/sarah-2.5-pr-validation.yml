          metadata=json.loads(Path('Sarah_Morgan_Android_Phone_First_v3/android-app/app/build/outputs/apk/debug/output-metadata.json').read_text())
          element=metadata['elements'][0]
          assert str(element['versionName']).startswith('2.5-r3-owner-repair'), element
          assert element['versionCode']==27, element
          print('Verified physical-test APK:', element)
          PY
