name: Sarah 2.5 observable validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  SARAH_OPENAI_API_KEY: ${{ secrets.SARAH_OPENAI_API_KEY }}
  SARAH_OPENAI_MODEL: gpt-5.1
  SARAH_MODEL_BACKEND_URL: ${{ secrets.SARAH_MODEL_BACKEND_URL }}
  SARAH_MODEL_BACKEND_TOKEN: ${{ secrets.SARAH_MODEL_BACKEND_TOKEN }}
  SARAH_TRAVEL_COMMERCE_URL: ${{ secrets.SARAH_TRAVEL_COMMERCE_URL }}
  SARAH_TRAVEL_COMMERCE_TOKEN: ${{ secrets.SARAH_TRAVEL_COMMERCE_TOKEN }}
  SARAH_VOICE_CONCIERGE_URL: ${{ secrets.SARAH_VOICE_CONCIERGE_URL }}
  SARAH_VOICE_CONCIERGE_TOKEN: ${{ secrets.SARAH_VOICE_CONCIERGE_TOKEN }}
  SARAH_ELEVENLABS_API_KEY: ${{ secrets.SARAH_ELEVENLABS_API_KEY }}
  SARAH_ELEVENLABS_VOICE_ID: ${{ secrets.SARAH_ELEVENLABS_VOICE_ID }}
  SARAH_ELEVENLABS_MODEL_ID: ${{ secrets.SARAH_ELEVENLABS_MODEL_ID }}
  SARAH_ELEVENLABS_BACKEND_URL: ${{ secrets.SARAH_ELEVENLABS_BACKEND_URL }}
  SARAH_ELEVENLABS_BACKEND_TOKEN: ${{ secrets.SARAH_ELEVENLABS_BACKEND_TOKEN }}
  SARAH_TAVILY_API_KEY: ${{ secrets.SARAH_TAVILY_API_KEY }}
  SARAH_STAY22_AID: ${{ secrets.SARAH_STAY22_AID }}
  SARAH_STAY22_BACKEND_URL: ${{ secrets.SARAH_STAY22_BACKEND_URL }}
  SARAH_STAY22_BACKEND_TOKEN: ${{ secrets.SARAH_STAY22_BACKEND_TOKEN }}

jobs:
  android-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Protected online-mind source contract
        run: |
          node --check services/sarah-model-proxy/src/index.js
          grep -Fq "SARAH_OPENAI_MODEL" Sarah_Morgan_Android_Phone_First_v3/android-app/app/build.gradle
          grep -Fq "BuildConfig.SARAH_OPENAI_MODEL" Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/SarahModelConfig.java
          grep -Fq "OPENAI_API_KEY" services/sarah-model-proxy/wrangler.jsonc
          grep -Fq "SARAH_BACKEND_TOKEN" services/sarah-model-proxy/wrangler.jsonc
      - name: Windows core and approval-gate tests
        working-directory: windows-companion
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pytest -q tests
          python -m compileall -q .
          python sarah_event_ready.py --self-test
      - name: Android pure-Java contracts
        run: |
          rm -rf build/sarah25-core && mkdir -p build/sarah25-core
          javac -encoding UTF-8 -d build/sarah25-core \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/IdentityIntent.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/UniversalCalmSupport.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/SarahChannelResponse.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/TrustedSyncProtocol.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/KnownEventCatalog.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/DestinationParser.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/TravelContextResolver.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/GenericEventReference.java \
            Sarah_Morgan_Android_Phone_First_v3/tests/Sarah22CoreTest.java \
            Sarah_Morgan_Android_Phone_First_v3/tests/Sarah25ConversationContextTest.java
          java -cp build/sarah25-core Sarah22CoreTest
          java -cp build/sarah25-core Sarah25ConversationContextTest
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build and verify real Android 2.5 APK
        run: |
          gradle -p Sarah_Morgan_Android_Phone_First_v3/android-app :app:assembleDebug --stacktrace
          cp Sarah_Morgan_Android_Phone_First_v3/android-app/app/build/outputs/apk/debug/app-debug.apk Sarah-Morgan-2.5-event-ready.apk
          python - <<'PY'
          import json
          from pathlib import Path
          metadata=json.loads(Path('Sarah_Morgan_Android_Phone_First_v3/android-app/app/build/outputs/apk/debug/output-metadata.json').read_text())
          element=metadata['elements'][0]
          assert str(element['versionName']).startswith('2.5-event-ready'), element
          assert element['versionCode']==25, element
          print('Verified physical-test APK:', element)
          PY
          unzip -t Sarah-Morgan-2.5-event-ready.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: Sarah-2.5-validated-APK
          path: Sarah-Morgan-2.5-event-ready.apk
          if-no-files-found: error

  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows-companion/requirements.txt
      - name: Test Windows source
        shell: pwsh
        working-directory: windows-companion
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pytest -q tests
          python -m compileall -q .
          python sarah_event_ready.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Source self-test failed.' }
      - name: Build Sarah application and one-file installer
        shell: pwsh
        working-directory: windows-companion
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SarahTravelOS --collect-all pystray --collect-all PIL --collect-all playsound3 --hidden-import googleapiclient.discovery --hidden-import google_auth_oauthlib.flow sarah_event_ready.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SarahMorganTravelOS-Setup --add-binary 'dist\SarahTravelOS.exe;payload' sarah_installer.py
          if (!(Test-Path 'dist\SarahMorganTravelOS-Setup.exe')) { throw 'Installer was not created.' }
      - name: Self-test the exact public EXE
        shell: pwsh
        working-directory: windows-companion
        run: |
          $process = Start-Process -FilePath '.\dist\SarahMorganTravelOS-Setup.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer self-test returned $($process.ExitCode)." }
          $file=Get-Item '.\dist\SarahMorganTravelOS-Setup.exe'
          if ($file.Length -lt 1000000) { throw 'Installer is unexpectedly small.' }
          $bytes=[System.IO.File]::ReadAllBytes($file.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Not a PE executable.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Sarah-2.5-validated-Windows-EXE
          path: windows-companion/dist/SarahMorganTravelOS-Setup.exe
          if-no-files-found: error
