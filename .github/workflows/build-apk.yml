name: Build Sarah Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sarah source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Test automatic Smart Local and public lookup routing
        run: |
          mkdir -p build/pure-java-test
          javac -encoding UTF-8 -d build/pure-java-test \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/ConversationModePolicy.java \
            Sarah_Morgan_Android_Phone_First_v3/tests/ConversationModePolicyTest.java
          java -cp build/pure-java-test ConversationModePolicyTest

      - name: Test Travel Brain active context and multimodal routes
        run: |
          rm -rf build/travel-brain-test
          mkdir -p build/travel-brain-test
          javac -encoding UTF-8 -d build/travel-brain-test \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/KnownEventCatalog.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/DestinationParser.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/EventTripIntentParser.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/TravelContextResolver.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/JourneyIntentParser.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/JourneyPlannerCore.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/TravelKnowledgeBase.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/TravelBrainCore.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/MemoryExtractor.java \
            Sarah_Morgan_Android_Phone_First_v3/tests/TravelBrainCoreTest.java \
            Sarah_Morgan_Android_Phone_First_v3/tests/TravelContextResolverTest.java \
            Sarah_Morgan_Android_Phone_First_v3/tests/JourneyIntentParserTest.java \
            Sarah_Morgan_Android_Phone_First_v3/tests/MemoryExtractorTravelBrainTest.java
          java -cp build/travel-brain-test TravelBrainCoreTest
          java -cp build/travel-brain-test TravelContextResolverTest
          java -cp build/travel-brain-test JourneyIntentParserTest
          java -cp build/travel-brain-test MemoryExtractorTravelBrainTest

      - name: Test official event agentic booking and multimodal planning
        run: |
          rm -rf build/agentic-test
          mkdir -p build/agentic-test
          javac -encoding UTF-8 -d build/agentic-test \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/KnownEventCatalog.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/DestinationParser.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/BookingLinkParser.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/EventTripIntentParser.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/TravelContextResolver.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/JourneyIntentParser.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/JourneyPlannerCore.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/AgenticTravelPlanner.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/DestinationPackResponder.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/TravelMediaHelper.java \
            Sarah_Morgan_Android_Phone_First_v3/tests/AgenticTravelPlannerTest.java \
            Sarah_Morgan_Android_Phone_First_v3/tests/DestinationPackResponderTest.java \
            Sarah_Morgan_Android_Phone_First_v3/tests/EventTripIntentParserTest.java \
            Sarah_Morgan_Android_Phone_First_v3/tests/BookingLinkParserTest.java \
            Sarah_Morgan_Android_Phone_First_v3/tests/EventTripPlannerTest.java \
            Sarah_Morgan_Android_Phone_First_v3/tests/KnownEventCatalogTest.java
          java -cp build/agentic-test AgenticTravelPlannerTest
          java -cp build/agentic-test DestinationPackResponderTest
          java -cp build/agentic-test EventTripIntentParserTest
          java -cp build/agentic-test BookingLinkParserTest
          java -cp build/agentic-test EventTripPlannerTest
          java -cp build/agentic-test KnownEventCatalogTest

      - name: Preserve Sarah's private-test debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sarah-morgan-debug-signing-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Sarah 1.4 public-web-fallback APK
        run: gradle -p Sarah_Morgan_Android_Phone_First_v3/android-app :app:assembleDebug --stacktrace

      - name: Give APK a versioned filename
        run: cp Sarah_Morgan_Android_Phone_First_v3/android-app/app/build/outputs/apk/debug/app-debug.apk Sarah-Morgan-1.4-public-web-fallback.apk

      - name: Upload Sarah 1.4 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sarah-Morgan-1.4-public-web-fallback
          path: Sarah-Morgan-1.4-public-web-fallback.apk
          if-no-files-found: error
