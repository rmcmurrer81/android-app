name: Build Sarah Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sarah source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test automatic Smart-to-Local routing
        run: |
          mkdir -p build/pure-java-test
          javac -encoding UTF-8 -d build/pure-java-test \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/ConversationModePolicy.java \
            Sarah_Morgan_Android_Phone_First_v3/tests/ConversationModePolicyTest.java
          java -cp build/pure-java-test ConversationModePolicyTest

      - name: Test Sarah Travel Brain conversation and memory
        run: |
          rm -rf build/travel-brain-test
          mkdir -p build/travel-brain-test
          javac -encoding UTF-8 -d build/travel-brain-test \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/DestinationParser.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/TravelKnowledgeBase.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/TravelBrainCore.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/DemoSarah.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/MemoryExtractor.java \
            Sarah_Morgan_Android_Phone_First_v3/tests/TravelBrainCoreTest.java \
            Sarah_Morgan_Android_Phone_First_v3/tests/MemoryExtractorTravelBrainTest.java
          java -cp build/travel-brain-test TravelBrainCoreTest
          java -cp build/travel-brain-test MemoryExtractorTravelBrainTest

      - name: Preserve Sarah's private-test debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sarah-morgan-debug-signing-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Sarah 1.0 travel-brain APK
        run: gradle -p Sarah_Morgan_Android_Phone_First_v3/android-app :app:assembleDebug --stacktrace

      - name: Give APK a versioned filename
        run: cp Sarah_Morgan_Android_Phone_First_v3/android-app/app/build/outputs/apk/debug/app-debug.apk Sarah-Morgan-1.0-travel-brain.apk

      - name: Upload Sarah 1.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sarah-Morgan-1.0-travel-brain
          path: Sarah-Morgan-1.0-travel-brain.apk
          if-no-files-found: error
