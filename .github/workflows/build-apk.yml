name: Materialize Sarah Public Source Baseline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct and verify the complete Sarah 2.3 source archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find public-release/parts -maxdepth 1 -type f -name 'part-*.txt' | sort)
          test "${#parts[@]}" -eq 15
          cat "${parts[@]}" > /tmp/sarah23.b64
          base64 --decode /tmp/sarah23.b64 > /tmp/Sarah_Travel_OS_2.3_Source.zip
          expected="$(awk '{print $1}' public-release/SOURCE_SHA256.txt)"
          actual="$(sha256sum /tmp/Sarah_Travel_OS_2.3_Source.zip | awk '{print $1}')"
          test "$actual" = "$expected"
          rm -rf /tmp/sarah23-source
          mkdir -p /tmp/sarah23-source
          unzip -q /tmp/Sarah_Travel_OS_2.3_Source.zip -d /tmp/sarah23-source
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('/tmp/sarah23-source')
          release = json.loads((root / 'PUBLIC_RELEASE.json').read_text(encoding='utf-8'))
          if release.get('version') != '2.3-public-continuity':
              raise SystemExit(f"Unexpected baseline version: {release.get('version')}")
          for required in [
              root / 'windows-companion' / 'sarah_core' / 'desktop.py',
              root / 'windows-companion' / 'SarahMorganWindows.spec',
              root / 'android-upgrade' / 'apply_android_upgrade.py',
          ]:
              if not required.is_file():
                  raise SystemExit(f'Missing baseline source: {required}')
          print(f"Verified {sum(p.is_file() for p in root.rglob('*'))} baseline files")
          PY

      - name: Materialize readable phone and Windows source on main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf windows-companion development-tools/sarah-2.3-android-upgrade
          cp -a /tmp/sarah23-source/windows-companion ./windows-companion
          mkdir -p development-tools
          cp -a /tmp/sarah23-source/android-upgrade development-tools/sarah-2.3-android-upgrade
          find windows-companion development-tools/sarah-2.3-android-upgrade -type d -name __pycache__ -prune -exec rm -rf {} +
          find windows-companion development-tools/sarah-2.3-android-upgrade -type f -name '*.pyc' -delete

      - name: Verify baseline tests before committing
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet -r windows-companion/requirements.txt
          python -m unittest discover -s windows-companion/tests -v
          python -m compileall -q windows-companion
          python development-tools/sarah-2.3-android-upgrade/run_android_upgrade_tests.py

      - name: Commit readable baseline source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sarah Source Materializer'
          git config user.email 'actions@users.noreply.github.com'
          git add windows-companion development-tools/sarah-2.3-android-upgrade
          if git diff --cached --quiet; then
            echo 'Sarah baseline source is already readable on main.'
          else
            git commit -m '[skip ci] Materialize verified Sarah phone and Windows baseline source'
            git push origin HEAD:main
          fi
