name: Build Sarah Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sarah source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Sarah 0.5 smart-search APK
        run: gradle -p Sarah_Morgan_Android_Phone_First_v3/android-app :app:assembleDebug --stacktrace

      - name: Give APK a versioned filename
        run: cp Sarah_Morgan_Android_Phone_First_v3/android-app/app/build/outputs/apk/debug/app-debug.apk Sarah-Morgan-0.5-smart-search.apk

      - name: Upload Sarah 0.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: Sarah-Morgan-0.5-smart-search
          path: Sarah-Morgan-0.5-smart-search.apk
          if-no-files-found: error
