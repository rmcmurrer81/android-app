              'SARAH_MODEL_BACKEND_TOKEN': os.environ['SARAH_BACKEND_TOKEN'],
              'SARAH_MODEL_PROVIDER': os.environ['SARAH_MODEL_PROVIDER'],
              'SARAH_MODEL_ID': os.environ['SARAH_MODEL_ID'],
          }, Path(os.environ['SARAH_RUNTIME_ROOT']))
          PY
          python -B windows-companion/sarah_r3_acceptance.py \
            --working-root "$runtime_root/work" \
            --evidence-root "$evidence_root" \
            --live \
            --live-config-root "$runtime_root" \
            --confirm-live I_AUTHORIZE_BOUNDED_SARAH_LIVE_ACCEPTANCE \
            --max-turns 10
          SARAH_EVIDENCE_ROOT="$evidence_root" python - <<'PY'
          import json
          import os
          from pathlib import Path

          roots = sorted(Path(os.environ['SARAH_EVIDENCE_ROOT']).glob('attempt_*'))
          if len(roots) != 1:
              raise SystemExit(f'Expected exactly one ephemeral live attempt, found {len(roots)}.')
          payload = json.loads((roots[0] / 'turns.json').read_text(encoding='utf-8'))
          if payload.get('mode') != 'LIVE_CLOUDFLARE_OWNER_AUTHORIZED':
              raise SystemExit('Conversation battery did not use the explicit live route.')
          turns = payload.get('turns') or []
          if payload.get('objective_pass') is not True:
              print(
                  '::group::Redacted bounded-live objective failures '
                  f"({payload.get('objective_passed_checks')}/{payload.get('objective_total_checks')} checks passed)"
              )
              for turn in turns:
                  failed = [
                      check for check in (turn.get('objective_checks') or [])
                      if check.get('passed') is not True
                  ]
                  if not failed:
                      continue
                  print(
                      'turn=', turn.get('turn_id'),
                      'route=', turn.get('route'),
                      'wall_latency_ms=', turn.get('wall_latency_ms'),
                      'raw_reply_sha256=', turn.get('raw_model_reply_sha256'),
                      'final_spoken_sha256=', turn.get('final_spoken_sha256'),
                  )
                  for check in failed:
                      # Check details contain only static gate descriptions,
                      # routes, counts, or timings. Never print prompts, replies,
                      # tokens, endpoint URLs, or owner data into public CI logs.
                      detail = str(check.get('detail') or '').replace('\n', ' ')[:500]
                      print('  failed_check=', check.get('name'), 'detail=', detail)
              print('::endgroup::')
          if payload.get('objective_pass') is not True or payload.get('turn_count') != 10:
              raise SystemExit(
                  'Bounded live conversation battery failed an objective gate; '
                  'see the redacted per-turn gate summary above.'
              )
          by_id = {turn.get('turn_id'): turn for turn in turns}
          expected_transition = {
              'natural_conversation': 'ONLINE_WORKERS_AI',
              'flight_calm': 'LOCAL_TOOL_RESULT',
              'offline_conversation': 'OFFLINE_LOCAL',
              'connected_failure_fallback': 'ONLINE_FAILED_FELL_BACK_OFFLINE',
              'automatic_online_return': 'ONLINE_WORKERS_AI',
          }
          actual_transition = {
              name: (by_id.get(name) or {}).get('route')
              for name in expected_transition
          }
          if actual_transition != expected_transition:
              raise SystemExit(
                  f'Live online/offline/restored transition mismatch: {actual_transition}'
              )
          online_turns = [turn for turn in turns if turn.get('route') == 'ONLINE_WORKERS_AI']
          if len(online_turns) < 5:
              raise SystemExit('Live battery did not complete enough exact Workers AI turns.')
          latencies = sorted(int(turn.get('wall_latency_ms') or 0) for turn in online_turns)
          if any(value <= 0 or value > 30_000 for value in latencies):
              raise SystemExit(f'Live text latency escaped the bounded acceptance window: {latencies}')
          middle = len(latencies) // 2
          median = latencies[middle] if len(latencies) % 2 else (latencies[middle - 1] + latencies[middle]) // 2
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('objective=passed_10_of_10_with_online_offline_restore\n')
              output.write(f'text_median_ms={median}\n')
              output.write(f'text_max_ms={max(latencies)}\n')
          print(
              'Production ModelClient live 10-turn battery passed; transition:',
              actual_transition,
              'online text latencies ms:', latencies,
          )
          PY

      - name: Preserve Sarah private-test Android signing continuity
        id: signing_cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sarah-morgan-debug-signing-v1

      - name: Fail closed unless the preserved R1 signing key was restored
        if: steps.signing_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo '::error::R1 signing cache was not an exact hit. R3 is migration-blocked; do not uninstall R1 or upload this APK.'
          exit 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build the online/offline owner-acceptance candidate APK
        env:
          SARAH_OPENAI_API_KEY: ''
          SARAH_ELEVENLABS_API_KEY: ''
          SARAH_MODEL_PROVIDER: ${{ steps.config.outputs.provider }}
          SARAH_MODEL_ID: ${{ steps.config.outputs.model }}
          SARAH_LIVE_CONVERSATION_OBJECTIVE: ${{ steps.live_conversation.outputs.objective }}
          SARAH_LIVE_TEXT_MEDIAN_MS: ${{ steps.live_conversation.outputs.text_median_ms }}
          SARAH_LIVE_TEXT_MAX_MS: ${{ steps.live_conversation.outputs.text_max_ms }}
          SARAH_LIVE_VOICE_FIRST_BYTE_MS: ${{ steps.protected_acceptance.outputs.voice_first_byte_ms }}
          SARAH_LIVE_VOICE_COMPLETE_MS: ${{ steps.protected_acceptance.outputs.voice_response_complete_ms }}
          SARAH_MODEL_BACKEND_URL: ${{ steps.deploy.outputs.backend_url }}
          SARAH_MODEL_BACKEND_TOKEN: ''
          SARAH_EXPECTED_DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          SARAH_EXPECTED_WORKER_SOURCE_SHA256: ${{ steps.deploy.outputs.source_sha256 }}
          SARAH_EXPECTED_WORKER_CONFIG_SHA256: ${{ steps.deploy.outputs.config_sha256 }}
          SARAH_ELEVENLABS_VOICE_ID: ${{ secrets.SARAH_ELEVENLABS_VOICE_ID || 'WcGvc9xxaOYbKswm3NBx' }}
          SARAH_ELEVENLABS_MODEL_ID: ${{ secrets.SARAH_ELEVENLABS_MODEL_ID || 'eleven_flash_v2_5' }}
          SARAH_ELEVENLABS_BACKEND_TOKEN: ''
          SARAH_TAVILY_API_KEY: ''
          SARAH_STAY22_BACKEND_URL: ''
          SARAH_STAY22_BACKEND_TOKEN: ''
          SARAH_TRAVEL_COMMERCE_URL: ''
          SARAH_TRAVEL_COMMERCE_TOKEN: ''
          SARAH_VOICE_CONCIERGE_URL: ''
          SARAH_VOICE_CONCIERGE_TOKEN: ''
        run: |
          set -euo pipefail
          export SARAH_ELEVENLABS_BACKEND_URL="${SARAH_MODEL_BACKEND_URL%/}/voice"
          gradle -p Sarah_Morgan_Android_Phone_First_v3/android-app :app:assembleDebug --stacktrace
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata_path = Path(
              'Sarah_Morgan_Android_Phone_First_v3/android-app/app/build/outputs/apk/debug/output-metadata.json'
          )
          metadata = json.loads(metadata_path.read_text(encoding='utf-8'))
          elements = metadata.get('elements') or []
          if len(elements) != 1:
              raise SystemExit(f'Expected exactly one debug APK metadata element, found {len(elements)}.')
          built = elements[0]
          actual_code = int(built.get('versionCode', -1))
          actual_name = str(built.get('versionName') or '')
          expected_code = int(os.environ['SARAH_R3_ANDROID_VERSION_CODE'])
          expected_name = os.environ['SARAH_R3_ANDROID_VARIANT_VERSION_NAME']
          if actual_code != expected_code or actual_name != expected_name:
              raise SystemExit(
                  'Built APK version identity mismatch: '
                  f'expected {expected_code}/{expected_name}, found {actual_code}/{actual_name}.'
              )
          if actual_code != 27 or not actual_name.startswith('2.5-r3-owner-repair'):
              raise SystemExit(f'Built APK is not the required R3 owner-repair version: {actual_code}/{actual_name}.')
          print('Built R3 APK version identity:', actual_code, actual_name)
          PY
          cp Sarah_Morgan_Android_Phone_First_v3/android-app/app/build/outputs/apk/debug/app-debug.apk \
            Sarah-Morgan-2.5-R3-CURRENT-OWNER-TEST.apk
          test -s Sarah-Morgan-2.5-R3-CURRENT-OWNER-TEST.apk
          unzip -t Sarah-Morgan-2.5-R3-CURRENT-OWNER-TEST.apk >/dev/null

          expected_signer=$(printf '%s' "${SARAH_R1_SIGNING_CERT_SHA256:-}" | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          r1_apk_sha=$(printf '%s' "${SARAH_R1_APK_SHA256:-}" | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          if ! [[ "$expected_signer" =~ ^[a-f0-9]{64}$ ]]; then
            echo '::error::SARAH_R1_SIGNING_CERT_SHA256 must contain the exact installed R1 signer SHA-256.'
            exit 1
          fi
          if ! [[ "$r1_apk_sha" =~ ^[a-f0-9]{64}$ ]]; then
            echo '::error::SARAH_R1_APK_SHA256 must preserve the exact owner-installed R1 APK checkpoint.'
            exit 1
          fi
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner=$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          if [ -z "$apksigner" ]; then
            echo '::error::Android apksigner was not found.'
            exit 1
          fi
          signer_output=$($apksigner verify --print-certs Sarah-Morgan-2.5-R3-CURRENT-OWNER-TEST.apk)
          actual_signer=$(printf '%s\n' "$signer_output" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n 1 | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          if ! [[ "$actual_signer" =~ ^[a-f0-9]{64}$ ]]; then
            echo '::error::Could not extract the built R3 signer SHA-256.'
            exit 1
          fi
          if [ "$actual_signer" != "$expected_signer" ]; then
            echo '::error::R3 signer differs from installed R1. In-place private-data upgrade is blocked; do not uninstall R1.'
            exit 1
          fi
          echo "SARAH_R1_SIGNER_SHA256=$expected_signer" >> "$GITHUB_ENV"
          echo "SARAH_R3_SIGNER_SHA256=$actual_signer" >> "$GITHUB_ENV"
          echo "SARAH_R1_APK_CHECKPOINT_SHA256=$r1_apk_sha" >> "$GITHUB_ENV"

          build_config=$(find Sarah_Morgan_Android_Phone_First_v3/android-app/app/build/generated \
            -type f -path '*/debug/*' -name BuildConfig.java -print | head -n 1)
          if [ -z "$build_config" ]; then
            echo '::error::Generated Android BuildConfig.java was not found for credential inspection.'
            exit 1
          fi
          python - "$build_config" <<'PY'
          import re, sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(encoding='utf-8')
          for field in (
              'SARAH_OPENAI_API_KEY',
              'SARAH_MODEL_BACKEND_TOKEN',
              'SARAH_TRAVEL_COMMERCE_TOKEN',
              'SARAH_VOICE_CONCIERGE_TOKEN',
              'SARAH_ELEVENLABS_API_KEY',
              'SARAH_ELEVENLABS_BACKEND_TOKEN',
              'SARAH_TAVILY_API_KEY',
              'SARAH_STAY22_BACKEND_TOKEN',
          ):
              match = re.search(rf'public static final String {field} = "([^"]*)";', text)
              if match is None or match.group(1):
                  raise SystemExit(f'Provider credential field {field} is not explicitly empty in generated BuildConfig.')
          print('Generated BuildConfig provider credential fields are empty.')
          PY
          rm -rf build/r3-apk-secret-scan
          mkdir -p build/r3-apk-secret-scan
          unzip -q Sarah-Morgan-2.5-R3-CURRENT-OWNER-TEST.apk -d build/r3-apk-secret-scan
          if grep -aERq '(sk[_-][A-Za-z0-9_-]{20,}|xi-[A-Za-z0-9_-]{20,}|tvly-[A-Za-z0-9_-]{20,}|CLOUDFLARE_API_TOKEN=[A-Za-z0-9_-]+)' \
              "$build_config" build/r3-apk-secret-scan; then
            echo '::error::A provider credential-like value was found in generated BuildConfig or decompressed APK/dex contents.'
            exit 1
          fi
          sha256sum Sarah-Morgan-2.5-R3-CURRENT-OWNER-TEST.apk \
            | tee Sarah-Morgan-2.5-R3-CURRENT-OWNER-TEST.sha256

      - name: Record exactly what the owner-acceptance candidate contains
        env:
