          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata_path = Path(
              'Sarah_Morgan_Android_Phone_First_v3/android-app/app/build/outputs/apk/debug/output-metadata.json'
          )
          metadata = json.loads(metadata_path.read_text(encoding='utf-8'))
          elements = metadata.get('elements') or []
          if len(elements) != 1:
              raise SystemExit(f'Expected exactly one debug APK metadata element, found {len(elements)}.')
          built = elements[0]
          actual_code = int(built.get('versionCode', -1))
          actual_name = str(built.get('versionName') or '')
          expected_code = int(os.environ['SARAH_R2_ANDROID_VERSION_CODE'])
          expected_name = os.environ['SARAH_R2_ANDROID_VARIANT_VERSION_NAME']
