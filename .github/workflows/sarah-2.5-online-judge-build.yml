              'SARAH_OPENAI_API_KEY',
              'SARAH_MODEL_BACKEND_TOKEN',
              'SARAH_TRAVEL_COMMERCE_TOKEN',
              'SARAH_VOICE_CONCIERGE_TOKEN',
              'SARAH_ELEVENLABS_API_KEY',
              'SARAH_ELEVENLABS_BACKEND_TOKEN',
              'SARAH_TAVILY_API_KEY',
              'SARAH_STAY22_BACKEND_TOKEN',
          ):
              match = re.search(rf'public static final String {field} = "([^"]*)";', text)
              if match is None or match.group(1):
                  raise SystemExit(f'Provider credential field {field} is not explicitly empty in generated BuildConfig.')
          print('Generated BuildConfig provider credential fields are empty.')
          PY
          rm -rf build/r2-apk-secret-scan
          mkdir -p build/r2-apk-secret-scan
          unzip -q Sarah-Morgan-2.5-R2-OWNER-ACCEPTANCE-CANDIDATE.apk -d build/r2-apk-secret-scan
          if grep -aERq '(sk[_-][A-Za-z0-9_-]{20,}|xi-[A-Za-z0-9_-]{20,}|tvly-[A-Za-z0-9_-]{20,}|CLOUDFLARE_API_TOKEN=[A-Za-z0-9_-]+)' \
              "$build_config" build/r2-apk-secret-scan; then
