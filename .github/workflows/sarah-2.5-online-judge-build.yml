name: Sarah 2.5 online judge build

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Protected online model provider
        required: true
        default: workers-ai
        type: choice
        options:
          - workers-ai
          - openai
      model:
        description: Provider model ID requested by this APK
        required: true
        default: '@cf/google/gemma-4-26b-a4b-it'
        type: string
  push:
    branches:
      - agent/sarah-2.5-event-ready
    paths:
      - .github/ONLINE_JUDGE_BUILD_REQUEST.json

permissions:
  contents: read

concurrency:
  group: sarah-2-5-r2-owner-repair-online-judge
  cancel-in-progress: true

jobs:
  deploy-smoke-test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SARAH_CANDIDATE_WORKER_NAME: sarah-r2-${{ github.run_id }}-${{ github.run_attempt }}
      # Public preserved-R1 evidence: exact installed APK and signer certificate.
      SARAH_R1_SIGNING_CERT_SHA256: d49b6dea8f8ddb332c170abd2d79240de011d302bdbec8a732f783910134c63c
      SARAH_R1_APK_SHA256: be67ceb0adf6d920532bb46a8b79a2be4b6c98dca20a5765f33a70489204b314
    outputs:
      backend_url: ${{ steps.deploy.outputs.backend_url }}
      model_provider: ${{ steps.config.outputs.provider }}
      model_id: ${{ steps.config.outputs.model }}

    steps:
      - name: Check out Sarah 2.5 source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run R2 source and pure-policy acceptance
        shell: bash
        run: |
          set -euo pipefail
          python Sarah_Morgan_Android_Phone_First_v3/tests/validate_package.py
          python -B Sarah_Morgan_Android_Phone_First_v3/tests/test_event_trip_store_contract.py -v
          python -B Sarah_Morgan_Android_Phone_First_v3/tests/test_runtime_privacy_contracts.py -v
          python -B Sarah_Morgan_Android_Phone_First_v3/tests/test_artifact_credential_boundary.py -v
          rm -rf build/sarah25-r2 && mkdir -p build/sarah25-r2
          javac -encoding UTF-8 -d build/sarah25-r2 \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/SarahChannelResponse.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/KnownEventCatalog.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/GenericEventReference.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/DestinationParser.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/TravelContextResolver.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/ProfileMigrationPolicy.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/TurnRoute.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/CurrentLocationPolicy.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/BackgroundResearchPolicy.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/AdaptiveResearchPlan.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/CalmSupport.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/ProfileLearningContext.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/ConnectedModelResponse.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/DestinationSourcePolicy.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/PublicSourceResult.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/VoiceRoutePolicy.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/ReplyTruthGuard.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/TextTurnReceipt.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/GmailTravelConnection.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/TravelPlanningConversationPolicy.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/MaturityAccessPolicy.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/TravelSearchQueryPolicy.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/OfflineTuringPolicy.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/MemoryExtractor.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/BookingLinkParser.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/BookingImportTextPolicy.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/EventTripIntentParser.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/EventTripProfilePolicy.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/EventTripMonitoringPolicy.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/JourneyIntentParser.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/TripWindowParser.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/CityVisitPlanner.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/JourneyPlannerCore.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/AgenticTravelPlanner.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/FinalDisplayedResponsePolicy.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/KnowledgePackSchedulingPolicy.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/KnowledgeProfileKey.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/ConnectedTurnPolicy.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/SyncPhotoPolicy.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/VoiceFallbackPolicy.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/TrustedLanEndpointPolicy.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/ProtectedBackendCapabilityPolicy.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/EventTripPreUpgradeVersionPolicy.java \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main/java/com/kiraworld/sarahtravel/TurnLifecyclePolicy.java \
            Sarah_Morgan_Android_Phone_First_v3/tests/SarahR2PolicyTest.java \
            Sarah_Morgan_Android_Phone_First_v3/tests/ProtectedBackendCapabilityPolicyTest.java \
            Sarah_Morgan_Android_Phone_First_v3/tests/EventTripPreUpgradeVersionPolicyTest.java \
            Sarah_Morgan_Android_Phone_First_v3/tests/EventTripIntentParserTest.java \
            Sarah_Morgan_Android_Phone_First_v3/tests/EventTripProfilePolicyTest.java
          java -cp build/sarah25-r2 com.kiraworld.sarahtravel.SarahR2PolicyTest
          java -cp build/sarah25-r2 com.kiraworld.sarahtravel.ProtectedBackendCapabilityPolicyTest
          java -cp build/sarah25-r2 com.kiraworld.sarahtravel.EventTripPreUpgradeVersionPolicyTest
          java -cp build/sarah25-r2 EventTripIntentParserTest
          java -cp build/sarah25-r2 com.kiraworld.sarahtravel.EventTripProfilePolicyTest

      - name: Require the R2 owner-repair Android version identity
        id: version_truth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          gradle_path = Path('Sarah_Morgan_Android_Phone_First_v3/android-app/app/build.gradle')
          gradle_text = gradle_path.read_text(encoding='utf-8')
          code_match = re.search(r'^\s*versionCode\s+(\d+)\s*$', gradle_text, re.MULTILINE)
          name_match = re.search(r"^\s*versionName\s+['\"]([^'\"]+)['\"]\s*$", gradle_text, re.MULTILINE)
          suffix_match = re.search(r"^\s*versionNameSuffix\s+['\"]([^'\"]+)['\"]\s*$", gradle_text, re.MULTILINE)
          if code_match is None or name_match is None:
              raise SystemExit('Could not read Android versionCode/versionName from app/build.gradle.')

          version_code = int(code_match.group(1))
          version_name = name_match.group(1)
          variant_version_name = version_name + (suffix_match.group(1) if suffix_match else '')
          required_prefix = '2.5-r2-owner-repair'
          if version_code != 26:
              raise SystemExit(f'R2 judge build requires Android versionCode 26, found {version_code}.')
          if not version_name.startswith(required_prefix):
              raise SystemExit(
                  f'R2 judge build requires versionName prefix {required_prefix!r}, found {version_name!r}.'
              )

          source_target = Path('BUILD_VERSION.txt').read_text(encoding='utf-8').strip()
          if required_prefix not in source_target:
              raise SystemExit(f'BUILD_VERSION.txt does not identify the R2 owner-repair source: {source_target!r}')

          github_env = Path(os.environ['GITHUB_ENV'])
          with github_env.open('a', encoding='utf-8') as handle:
              handle.write(f'SARAH_R2_ANDROID_VERSION_CODE={version_code}\n')
              handle.write(f'SARAH_R2_ANDROID_VERSION_NAME={version_name}\n')
              handle.write(f'SARAH_R2_ANDROID_VARIANT_VERSION_NAME={variant_version_name}\n')
              handle.write(f'SARAH_R2_SOURCE_TARGET={source_target}\n')
          print('R2 Android version identity:', version_code, version_name)
          PY

      - name: Resolve provider and model and require deployment credentials
        id: config
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.SARAH_OPENAI_API_KEY }}
          SARAH_ELEVENLABS_API_KEY: ${{ secrets.SARAH_ELEVENLABS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.SARAH_TAVILY_API_KEY }}
          # Voice IDs are public identifiers, not credentials. Prefer an owner
          # override, otherwise use Sarah's established approved voice.
          SARAH_ELEVENLABS_VOICE_ID: ${{ secrets.SARAH_ELEVENLABS_VOICE_ID || 'WcGvc9xxaOYbKswm3NBx' }}
          # Accept the current app-token name or the legacy protected-voice
          # app-token name. Both are revocable client-to-backend credentials;
          # neither is an ElevenLabs/provider API key.
          SARAH_MODEL_BACKEND_TOKEN: ${{ secrets.SARAH_MODEL_BACKEND_TOKEN || secrets.SARAH_ELEVENLABS_BACKEND_TOKEN }}
          DISPATCH_PROVIDER: ${{ inputs.provider }}
          DISPATCH_MODEL: ${{ inputs.model }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SARAH_ELEVENLABS_API_KEY SARAH_ELEVENLABS_VOICE_ID SARAH_MODEL_BACKEND_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if ! [[ "$SARAH_MODEL_BACKEND_TOKEN" =~ ^[A-Za-z0-9_-]{32,256}$ ]]; then
            echo "::error::SARAH_MODEL_BACKEND_TOKEN must be a 32-256 character URL-safe random value."
            exit 1
          fi

          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            PROVIDER="${DISPATCH_PROVIDER:-workers-ai}"
            MODEL="${DISPATCH_MODEL:-@cf/google/gemma-4-26b-a4b-it}"
          else
            readarray -t CONFIG < <(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.github/ONLINE_JUDGE_BUILD_REQUEST.json').read_text(encoding='utf-8'))
          print(str(data.get('provider') or 'workers-ai').strip())
          print(str(data.get('model') or '@cf/google/gemma-4-26b-a4b-it').strip())
          PY
            )
            PROVIDER="${CONFIG[0]}"
            MODEL="${CONFIG[1]}"
          fi

          if [ "$PROVIDER" != 'workers-ai' ] && [ "$PROVIDER" != 'openai' ]; then
            echo "::error::Unsupported provider: $PROVIDER"
            exit 1
          fi
          if [ "$PROVIDER" = 'openai' ] && [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY is required only when the explicitly selected provider is openai."
            exit 1
          fi
          if ! [[ "$MODEL" =~ ^[@A-Za-z0-9][@A-Za-z0-9._:/-]{0,119}$ ]]; then
            echo "::error::Invalid model ID: $MODEL"
            exit 1
          fi
          echo "provider=$PROVIDER" >> "$GITHUB_OUTPUT"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "Selected provider/model: $PROVIDER / $MODEL"

      - name: Install and syntax-check the protected Sarah model proxy
        working-directory: services/sarah-model-proxy
        run: |
          npm install --no-audit --no-fund
          npm run check

      - name: Deploy Sarah's protected R2 candidate online mind
        id: deploy
        working-directory: services/sarah-model-proxy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.SARAH_OPENAI_API_KEY }}
          SARAH_ELEVENLABS_API_KEY: ${{ secrets.SARAH_ELEVENLABS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.SARAH_TAVILY_API_KEY }}
          SARAH_ELEVENLABS_VOICE_ID: ${{ secrets.SARAH_ELEVENLABS_VOICE_ID || 'WcGvc9xxaOYbKswm3NBx' }}
          SARAH_BACKEND_TOKEN: ${{ secrets.SARAH_MODEL_BACKEND_TOKEN || secrets.SARAH_ELEVENLABS_BACKEND_TOKEN }}
          SARAH_MODEL_PROVIDER: ${{ steps.config.outputs.provider }}
          SARAH_MODEL_ID: ${{ steps.config.outputs.model }}
          SARAH_ELEVENLABS_MODEL_ID: ${{ secrets.SARAH_ELEVENLABS_MODEL_ID || 'eleven_flash_v2_5' }}
          SARAH_DEPLOYMENT_ID: ${{ github.sha }}
        run: |
          set -euo pipefail

          SOURCE_SHA256=$(sha256sum src/index.js | awk '{print $1}')
          CONFIG_SHA256=$(sha256sum wrangler.jsonc | awk '{print $1}')
          if ! [[ "$SOURCE_SHA256" =~ ^[a-f0-9]{64}$ ]] || ! [[ "$CONFIG_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo '::error::Could not calculate the exact Worker source/config hashes.'
            exit 1
          fi

          # Wrangler consumes dotenv syntax here. Deployment, live verification,
          # Android, and Windows all use the same revocable repository secret.
          umask 077
          printf 'SARAH_BACKEND_TOKEN=%s\n' "$SARAH_BACKEND_TOKEN" \
            > /tmp/sarah-model-proxy-secrets.env
          if [ "$SARAH_MODEL_PROVIDER" = 'openai' ]; then
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" \
              >> /tmp/sarah-model-proxy-secrets.env
          fi
          printf 'ELEVENLABS_API_KEY=%s\n' "$SARAH_ELEVENLABS_API_KEY" \
            >> /tmp/sarah-model-proxy-secrets.env
          if [ -n "${TAVILY_API_KEY:-}" ]; then
            printf 'TAVILY_API_KEY=%s\n' "$TAVILY_API_KEY" \
              >> /tmp/sarah-model-proxy-secrets.env
            protected_search_configured=true
          else
            protected_search_configured=false
          fi

          set +e
          npx wrangler deploy \
            --config wrangler.jsonc \
            --name "$SARAH_CANDIDATE_WORKER_NAME" \
            --secrets-file /tmp/sarah-model-proxy-secrets.env \
            --var "SARAH_MODEL_PROVIDER:$SARAH_MODEL_PROVIDER" \
            --var "SARAH_MODEL_ID:$SARAH_MODEL_ID" \
            --var "SARAH_ELEVENLABS_VOICE_ID:$SARAH_ELEVENLABS_VOICE_ID" \
            --var "SARAH_ELEVENLABS_MODEL_ID:$SARAH_ELEVENLABS_MODEL_ID" \
            --var "SARAH_DEPLOYMENT_ID:$SARAH_DEPLOYMENT_ID" \
            --var "SARAH_SOURCE_SHA256:$SOURCE_SHA256" \
            --var "SARAH_CONFIG_SHA256:$CONFIG_SHA256" \
            --keep-vars 2>&1 | tee /tmp/sarah-model-proxy-deploy.log
          deploy_status=${PIPESTATUS[0]}
          set -e
          rm -f /tmp/sarah-model-proxy-secrets.env
          if [ "$deploy_status" -ne 0 ]; then
            exit "$deploy_status"
          fi

          BACKEND_URL=$(python - <<'PY'
          import os
          import re
          from pathlib import Path
          text = Path('/tmp/sarah-model-proxy-deploy.log').read_text(encoding='utf-8', errors='replace')
          matches = re.findall(r'https://[A-Za-z0-9.-]+\.workers\.dev(?:/[A-Za-z0-9._~!$&\'()*+,;=:@%/-]*)?', text)
          if not matches:
              raise SystemExit('Could not find the deployed workers.dev URL in Wrangler output.')
          backend = matches[-1].rstrip('/')
          worker_name = os.environ['SARAH_CANDIDATE_WORKER_NAME']
          if not re.fullmatch(rf'https://{re.escape(worker_name)}\.[A-Za-z0-9-]+\.workers\.dev', backend):
              raise SystemExit(f'Wrangler returned an unexpected Worker URL: {backend}')
          print(backend)
          PY
          )
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$SARAH_DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$SOURCE_SHA256" >> "$GITHUB_OUTPUT"
          echo "config_sha256=$CONFIG_SHA256" >> "$GITHUB_OUTPUT"
          echo "protected_search_configured=$protected_search_configured" >> "$GITHUB_OUTPUT"
          echo "Deployed Sarah model proxy: $BACKEND_URL"

      - name: Prove the online mind answers before building the APK
        shell: bash
        env:
          BACKEND_URL: ${{ steps.deploy.outputs.backend_url }}
          SARAH_BACKEND_TOKEN: ${{ secrets.SARAH_MODEL_BACKEND_TOKEN || secrets.SARAH_ELEVENLABS_BACKEND_TOKEN }}
          SARAH_MODEL_PROVIDER: ${{ steps.config.outputs.provider }}
          SARAH_MODEL_ID: ${{ steps.config.outputs.model }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          EXPECTED_SOURCE_SHA256: ${{ steps.deploy.outputs.source_sha256 }}
          EXPECTED_CONFIG_SHA256: ${{ steps.deploy.outputs.config_sha256 }}
          PROTECTED_SEARCH_CONFIGURED: ${{ steps.deploy.outputs.protected_search_configured }}
        run: |
          set -euo pipefail
          deployment_ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
              -H 'Cache-Control: no-cache' \
              "$BACKEND_URL/health?deployment=$EXPECTED_DEPLOYMENT_ID&attempt=$attempt" \
              > /tmp/sarah-health.json; then
              if python - <<'PY'
          import json, os
          health = json.load(open('/tmp/sarah-health.json', encoding='utf-8'))
          expected = {
              'service': 'sarah-model-proxy',
              'contract_version': 'sarah-model-proxy-v2-workers-ai-voice',
              'deployment_id': os.environ['EXPECTED_DEPLOYMENT_ID'].lower(),
              'source_sha256': os.environ['EXPECTED_SOURCE_SHA256'].lower(),
              'config_sha256': os.environ['EXPECTED_CONFIG_SHA256'].lower(),
              'provider': os.environ['SARAH_MODEL_PROVIDER'],
              'model_override': os.environ['SARAH_MODEL_ID'],
          }
          matches = health.get('ok') is True and health.get('voice_ready') is True
          matches = matches and health.get('deployment_ready') is True
          matches = matches and health.get('route_rate_limits_ready') is True
          matches = matches and all(health.get(key) == value for key, value in expected.items())
          if os.environ.get('PROTECTED_SEARCH_CONFIGURED') == 'true':
              matches = matches and health.get('current_source_ready') is True
          if not matches:
              raise SystemExit(1)
          print('Exact Sarah Worker deployment is active:', expected['deployment_id'])
          PY
              then
                deployment_ready=1
                break
              fi
            fi
            sleep 3
          done
          if [ "$deployment_ready" -ne 1 ]; then
            echo '::error::The exact deployed Sarah Worker source/config did not become active before the bounded deadline.'
            python - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/sarah-health.json')
          observed = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {'health_response': 'unavailable'}
          print('Last non-secret health response:', observed)
          PY
            exit 1
          fi

          absent_capability_status="$(curl --silent --show-error --connect-timeout 5 --max-time 10 \
            -o /tmp/sarah-capabilities-absent.json -w '%{http_code}' \
            "$BACKEND_URL/capabilities")"
          if [ "$absent_capability_status" != '401' ]; then
            echo "::error::Protected capabilities accepted an absent bearer token (HTTP $absent_capability_status)."
            exit 1
          fi
          wrong_capability_status="$(curl --silent --show-error --connect-timeout 5 --max-time 10 \
            -H 'Authorization: Bearer deliberately-wrong-sarah-token' \
            -o /tmp/sarah-capabilities-wrong.json -w '%{http_code}' \
            "$BACKEND_URL/capabilities")"
          if [ "$wrong_capability_status" != '401' ]; then
            echo "::error::Protected capabilities accepted a wrong bearer token (HTTP $wrong_capability_status)."
            exit 1
          fi
          curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
            -H "Authorization: Bearer $SARAH_BACKEND_TOKEN" \
            -H 'Cache-Control: no-cache' \
            "$BACKEND_URL/capabilities?deployment=$EXPECTED_DEPLOYMENT_ID" \
            > /tmp/sarah-capabilities-exact.json
          python - <<'PY'
          import json, os
