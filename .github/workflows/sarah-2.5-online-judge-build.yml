  build-tested-windows-event-installer:
    needs: deploy-smoke-test-and-build
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Check out the exact Sarah source
        uses: actions/checkout@v5

      - name: Require and record the R3 Windows source identity
        id: version_truth
        shell: pwsh
        run: |
          $sourceTarget = (Get-Content -LiteralPath 'BUILD_VERSION.txt' -Raw).Trim()
          if ($sourceTarget -notlike '*2.5-r3-owner-repair*') {
            throw "BUILD_VERSION.txt does not identify the R3 owner-repair source: $sourceTarget"
          }
          $installerSource = Get-Content -LiteralPath 'windows-companion/sarah_installer.py' -Raw
          $versionMatch = [regex]::Match($installerSource, '(?m)^APP_VERSION\s*=\s*"([^"]+)"\s*$')
          if (!$versionMatch.Success) {
            throw 'Could not determine APP_VERSION from sarah_installer.py.'
          }
          $installerVersion = $versionMatch.Groups[1].Value
          "source_target=$sourceTarget" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "installer_version=$installerVersion" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          Write-Host "R3 Windows source target: $sourceTarget"
          Write-Host "R3 candidate installer version: $installerVersion"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows-companion/requirements.txt

      - name: Test Windows source without event credentials
        shell: pwsh
        working-directory: windows-companion
        env:
          SARAH_MODEL_BACKEND_URL: ''
          SARAH_MODEL_BACKEND_TOKEN: ''
          SARAH_ELEVENLABS_API_KEY: ''
          SARAH_ELEVENLABS_BACKEND_URL: ''
          SARAH_ELEVENLABS_BACKEND_TOKEN: ''
          SARAH_TAVILY_API_KEY: ''
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed.' }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Windows dependencies failed to install.' }
          python -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { throw 'Windows source tests failed.' }
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw 'Windows source compilation failed.' }
          python sarah_event_ready.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Source self-test failed.' }

      - name: Generate the event-only config and build the Windows installer
        shell: pwsh
        working-directory: windows-companion
        env:
          SARAH_MODEL_BACKEND_URL: ${{ needs.deploy-smoke-test-and-build.outputs.backend_url }}
          SARAH_MODEL_PROVIDER: ${{ needs.deploy-smoke-test-and-build.outputs.model_provider }}
          SARAH_MODEL_ID: ${{ needs.deploy-smoke-test-and-build.outputs.model_id }}
          SARAH_ELEVENLABS_VOICE_ID: ${{ secrets.SARAH_ELEVENLABS_VOICE_ID || 'WcGvc9xxaOYbKswm3NBx' }}
          SARAH_ELEVENLABS_MODEL_ID: ${{ secrets.SARAH_ELEVENLABS_MODEL_ID || 'eleven_flash_v2_5' }}
          SARAH_GMAIL_DESKTOP_CLIENT_ID: ${{ vars.SARAH_GMAIL_DESKTOP_CLIENT_ID }}
          SARAH_GMAIL_DESKTOP_CLIENT_SECRET: ${{ vars.SARAH_GMAIL_DESKTOP_CLIENT_SECRET }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('SARAH_MODEL_BACKEND_URL', 'SARAH_MODEL_PROVIDER', 'SARAH_MODEL_ID', 'SARAH_ELEVENLABS_VOICE_ID')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required event build setting is absent: $name"
            }
          }
          foreach ($name in @('SARAH_GMAIL_DESKTOP_CLIENT_ID', 'SARAH_GMAIL_DESKTOP_CLIENT_SECRET')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required public Desktop OAuth build identity is absent: repository variable $name"
            }
          }
          if ($env:SARAH_GMAIL_DESKTOP_CLIENT_ID -notmatch '^[A-Za-z0-9._-]+\.apps\.googleusercontent\.com$') {
            throw 'SARAH_GMAIL_DESKTOP_CLIENT_ID is not a Google installed-app client ID.'
          }
          $eventConfig = [ordered]@{
            SARAH_MODEL_BACKEND_URL = $env:SARAH_MODEL_BACKEND_URL
            SARAH_MODEL_PROVIDER = $env:SARAH_MODEL_PROVIDER
            SARAH_MODEL_ID = $env:SARAH_MODEL_ID
            SARAH_ELEVENLABS_VOICE_ID = $env:SARAH_ELEVENLABS_VOICE_ID
            SARAH_ELEVENLABS_MODEL_ID = $env:SARAH_ELEVENLABS_MODEL_ID
          }
          if (@($eventConfig.Keys | Where-Object { $_ -match '(TOKEN|API_KEY|PASSWORD|SECRET)' }).Count -ne 0) {
            throw 'A reusable credential was added to the Windows bundled event configuration.'
          }
          New-Item -ItemType Directory -Force -Path 'build' | Out-Null
          $eventConfigPath = (Resolve-Path 'build').Path + '\sarah-event-config.json'
          $gmailOAuthPath = (Resolve-Path 'build').Path + '\sarah-gmail-oauth-client.json'
          $eventConfig | ConvertTo-Json | Set-Content -LiteralPath $eventConfigPath -Encoding utf8NoBOM
          $gmailOAuth = [ordered]@{
            installed = [ordered]@{
              client_id = $env:SARAH_GMAIL_DESKTOP_CLIENT_ID
              project_id = 'sarah-owner-build'
              auth_uri = 'https://accounts.google.com/o/oauth2/auth'
              token_uri = 'https://oauth2.googleapis.com/token'
              client_secret = $env:SARAH_GMAIL_DESKTOP_CLIENT_SECRET
              redirect_uris = @('http://127.0.0.1')
            }
          }
          $gmailOAuth | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $gmailOAuthPath -Encoding utf8NoBOM
          try {
            python -m PyInstaller --noconfirm --clean --onefile --windowed --name SarahTravelOS-R3-Candidate --add-data "$eventConfigPath;." --add-data "$gmailOAuthPath;." --add-data 'assets\sarah_adult_portrait_r2_runtime_512.png;assets' --collect-all pystray --collect-all PIL --collect-all playsound3 --hidden-import miniaudio --hidden-import googleapiclient.discovery --hidden-import google_auth_oauthlib.flow --hidden-import google.oauth2.credentials --hidden-import google.auth.transport.requests --hidden-import sarah_wallet --hidden-import sarah_calendar sarah_event_ready.py
            if ($LASTEXITCODE -ne 0) { throw 'Sarah application build failed.' }
          }
          finally {
            Remove-Item -LiteralPath $eventConfigPath -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $gmailOAuthPath -Force -ErrorAction SilentlyContinue
          }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SarahMorganTravelOS-2.5-R3-CURRENT-OWNER-TEST-Setup --add-binary 'dist\SarahTravelOS-R3-Candidate.exe;payload' sarah_installer.py
          if ($LASTEXITCODE -ne 0) { throw 'Sarah installer build failed.' }
          if (!(Test-Path 'dist\SarahMorganTravelOS-2.5-R3-CURRENT-OWNER-TEST-Setup.exe')) { throw 'Installer was not created.' }

      - name: Self-test the exact event installer
        shell: pwsh
        working-directory: windows-companion
        run: |
          $process = Start-Process -FilePath '.\dist\SarahMorganTravelOS-2.5-R3-CURRENT-OWNER-TEST-Setup.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer self-test returned $($process.ExitCode)." }
          $file = Get-Item '.\dist\SarahMorganTravelOS-2.5-R3-CURRENT-OWNER-TEST-Setup.exe'
          if ($file.Length -lt 1000000) { throw 'Installer is unexpectedly small.' }
          $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Not a PE executable.' }

      - name: Record the Windows event artifact without credentials
        shell: pwsh
        working-directory: windows-companion
        env:
          BACKEND_URL: ${{ needs.deploy-smoke-test-and-build.outputs.backend_url }}
          SARAH_MODEL_PROVIDER: ${{ needs.deploy-smoke-test-and-build.outputs.model_provider }}
          SARAH_MODEL_ID: ${{ needs.deploy-smoke-test-and-build.outputs.model_id }}
        run: |
          $file = Get-Item '.\dist\SarahMorganTravelOS-2.5-R3-CURRENT-OWNER-TEST-Setup.exe'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content -LiteralPath '.\dist\SarahMorganTravelOS-2.5-R3-CURRENT-OWNER-TEST-Setup.sha256' -Encoding ascii
          $manifest = [ordered]@{
            product = 'Sarah Morgan Travel OS'
            repair_revision = 'R3_OWNER_REPAIR'
            artifact_status = 'CURRENT_OWNER_TEST_PENDING_PHYSICAL_ACCEPTANCE'
            version = '${{ steps.version_truth.outputs.installer_version }}'
            source_version_target = '${{ steps.version_truth.outputs.source_target }}'
            compatibility_installer_version = '${{ steps.version_truth.outputs.installer_version }}'
            installer_filename = $file.Name
            source_commit = $env:GITHUB_SHA
            provider_requested = $env:SARAH_MODEL_PROVIDER
            model_requested = $env:SARAH_MODEL_ID
            backend_url = $env:BACKEND_URL
            provider_key_embedded = $false
            elevenlabs_key_embedded = $false
            event_app_token_bundled = $false
            gmail_desktop_oauth_public_client_bundled = $true
            gmail_scope = 'gmail.readonly'
            gmail_account_connected = $false
            gmail_owner_consent_required = $true
            owner_runtime_activation_required = $true
            live_online_smoke_test = 'passed-before-windows-build'
            exact_installer_self_test = 'passed'
            physical_8gb_laptop_acceptance = 'pending'
            full_owner_workflow_acceptance = 'pending'
            token_rotation_required_after_event = $false
            token_rotation_required_if_privately_transferred_code_is_exposed = $true
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath '.\dist\SarahMorganTravelOS-2.5-R3-CURRENT-OWNER-TEST-Setup-manifest.json' -Encoding utf8NoBOM

      - name: Upload the Windows owner-acceptance candidate
        uses: actions/upload-artifact@v4
        with:
          name: Sarah-2.5-R3-CURRENT-OWNER-TEST-Windows-ElevenLabs-Candidate
          path: |
            windows-companion/dist/SarahMorganTravelOS-2.5-R3-CURRENT-OWNER-TEST-Setup.exe
            windows-companion/dist/SarahMorganTravelOS-2.5-R3-CURRENT-OWNER-TEST-Setup.sha256
            windows-companion/dist/SarahMorganTravelOS-2.5-R3-CURRENT-OWNER-TEST-Setup-manifest.json
            docs/SARAH_WINDOWS_ARTIFACT_LINEAGE_20260808.md
          if-no-files-found: error
          retention-days: 14
