          WORKER_NAME: ${{ env.SARAH_CANDIDATE_WORKER_NAME }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          WORKER_SOURCE_SHA256: ${{ steps.deploy.outputs.source_sha256 }}
          WORKER_CONFIG_SHA256: ${{ steps.deploy.outputs.config_sha256 }}
          SARAH_MODEL_PROVIDER: ${{ steps.config.outputs.provider }}
          SARAH_MODEL_ID: ${{ steps.config.outputs.model }}
          SARAH_LIVE_CONVERSATION_OBJECTIVE: ${{ steps.live_conversation.outputs.objective }}
          SARAH_LIVE_TEXT_MEDIAN_MS: ${{ steps.live_conversation.outputs.text_median_ms }}
          SARAH_LIVE_TEXT_MAX_MS: ${{ steps.live_conversation.outputs.text_max_ms }}
          SARAH_LIVE_VOICE_FIRST_BYTE_MS: ${{ steps.protected_acceptance.outputs.voice_first_byte_ms }}
          SARAH_LIVE_VOICE_COMPLETE_MS: ${{ steps.protected_acceptance.outputs.voice_response_complete_ms }}
        run: |
