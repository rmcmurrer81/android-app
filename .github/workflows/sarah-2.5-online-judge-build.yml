name: Sarah 2.5 online judge build

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Protected online model provider
        required: true
        default: workers-ai
        type: choice
        options:
          - workers-ai
          - openai
      model:
        description: Provider model ID requested by this APK
        required: true
        default: '@cf/google/gemma-4-26b-a4b-it'
        type: string
  push:
    branches:
      - agent/sarah-2.5-event-ready
    paths:
      - .github/ONLINE_JUDGE_BUILD_REQUEST.json

permissions:
  contents: read

concurrency:
  group: sarah-2-5-online-judge-production
  cancel-in-progress: true

jobs:
  deploy-smoke-test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      backend_url: ${{ steps.deploy.outputs.backend_url }}
      model_provider: ${{ steps.config.outputs.provider }}
      model_id: ${{ steps.config.outputs.model }}

    steps:
      - name: Check out Sarah 2.5 source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve provider and model and require deployment credentials
        id: config
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.SARAH_OPENAI_API_KEY }}
          SARAH_ELEVENLABS_API_KEY: ${{ secrets.SARAH_ELEVENLABS_API_KEY }}
          # Voice IDs are public identifiers, not credentials. Prefer an owner
          # override, otherwise use Sarah's established approved voice.
          SARAH_ELEVENLABS_VOICE_ID: ${{ secrets.SARAH_ELEVENLABS_VOICE_ID || 'WcGvc9xxaOYbKswm3NBx' }}
          # Accept the current app-token name or the legacy protected-voice
          # app-token name. Both are revocable client-to-backend credentials;
          # neither is an ElevenLabs/provider API key.
          SARAH_MODEL_BACKEND_TOKEN: ${{ secrets.SARAH_MODEL_BACKEND_TOKEN || secrets.SARAH_ELEVENLABS_BACKEND_TOKEN }}
          DISPATCH_PROVIDER: ${{ inputs.provider }}
          DISPATCH_MODEL: ${{ inputs.model }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SARAH_ELEVENLABS_API_KEY SARAH_ELEVENLABS_VOICE_ID SARAH_MODEL_BACKEND_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if ! [[ "$SARAH_MODEL_BACKEND_TOKEN" =~ ^[A-Za-z0-9_-]{32,256}$ ]]; then
            echo "::error::SARAH_MODEL_BACKEND_TOKEN must be a 32-256 character URL-safe random value."
            exit 1
          fi

          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            PROVIDER="${DISPATCH_PROVIDER:-workers-ai}"
            MODEL="${DISPATCH_MODEL:-@cf/google/gemma-4-26b-a4b-it}"
          else
            readarray -t CONFIG < <(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.github/ONLINE_JUDGE_BUILD_REQUEST.json').read_text(encoding='utf-8'))
          print(str(data.get('provider') or 'workers-ai').strip())
          print(str(data.get('model') or '@cf/google/gemma-4-26b-a4b-it').strip())
          PY
            )
            PROVIDER="${CONFIG[0]}"
            MODEL="${CONFIG[1]}"
          fi

          if [ "$PROVIDER" != 'workers-ai' ] && [ "$PROVIDER" != 'openai' ]; then
            echo "::error::Unsupported provider: $PROVIDER"
            exit 1
          fi
          if [ "$PROVIDER" = 'openai' ] && [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY is required only when the explicitly selected provider is openai."
            exit 1
          fi
          if ! [[ "$MODEL" =~ ^[@A-Za-z0-9][@A-Za-z0-9._:/-]{0,119}$ ]]; then
            echo "::error::Invalid model ID: $MODEL"
            exit 1
          fi
          echo "provider=$PROVIDER" >> "$GITHUB_OUTPUT"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "Selected provider/model: $PROVIDER / $MODEL"

      - name: Install and syntax-check the protected Sarah model proxy
        working-directory: services/sarah-model-proxy
        run: |
          npm install --no-audit --no-fund
          npm run check

      - name: Deploy Sarah's protected online mind
        id: deploy
        working-directory: services/sarah-model-proxy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.SARAH_OPENAI_API_KEY }}
          SARAH_ELEVENLABS_API_KEY: ${{ secrets.SARAH_ELEVENLABS_API_KEY }}
          SARAH_ELEVENLABS_VOICE_ID: ${{ secrets.SARAH_ELEVENLABS_VOICE_ID || 'WcGvc9xxaOYbKswm3NBx' }}
          SARAH_BACKEND_TOKEN: ${{ secrets.SARAH_MODEL_BACKEND_TOKEN || secrets.SARAH_ELEVENLABS_BACKEND_TOKEN }}
          SARAH_MODEL_PROVIDER: ${{ steps.config.outputs.provider }}
          SARAH_MODEL_ID: ${{ steps.config.outputs.model }}
          SARAH_ELEVENLABS_MODEL_ID: ${{ secrets.SARAH_ELEVENLABS_MODEL_ID || 'eleven_flash_v2_5' }}
        run: |
          set -euo pipefail

          # Wrangler consumes dotenv syntax here. Deployment, live verification,
          # Android, and Windows all use the same revocable repository secret.
          umask 077
          printf 'SARAH_BACKEND_TOKEN=%s\n' "$SARAH_BACKEND_TOKEN" \
            > /tmp/sarah-model-proxy-secrets.env
          if [ "$SARAH_MODEL_PROVIDER" = 'openai' ]; then
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY" \
              >> /tmp/sarah-model-proxy-secrets.env
          fi
          printf 'ELEVENLABS_API_KEY=%s\n' "$SARAH_ELEVENLABS_API_KEY" \
            >> /tmp/sarah-model-proxy-secrets.env

          set +e
          npx wrangler deploy \
            --secrets-file /tmp/sarah-model-proxy-secrets.env \
            --var "SARAH_MODEL_PROVIDER:$SARAH_MODEL_PROVIDER" \
            --var "SARAH_MODEL_ID:$SARAH_MODEL_ID" \
            --var "SARAH_ELEVENLABS_VOICE_ID:$SARAH_ELEVENLABS_VOICE_ID" \
            --var "SARAH_ELEVENLABS_MODEL_ID:$SARAH_ELEVENLABS_MODEL_ID" \
            --keep-vars 2>&1 | tee /tmp/sarah-model-proxy-deploy.log
          deploy_status=${PIPESTATUS[0]}
          set -e
          rm -f /tmp/sarah-model-proxy-secrets.env
          if [ "$deploy_status" -ne 0 ]; then
            exit "$deploy_status"
          fi

          BACKEND_URL=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/sarah-model-proxy-deploy.log').read_text(encoding='utf-8', errors='replace')
          matches = re.findall(r'https://[A-Za-z0-9.-]+\.workers\.dev(?:/[A-Za-z0-9._~!$&\'()*+,;=:@%/-]*)?', text)
          if not matches:
              raise SystemExit('Could not find the deployed workers.dev URL in Wrangler output.')
          print(matches[-1].rstrip('/'))
          PY
          )
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed Sarah model proxy: $BACKEND_URL"

      - name: Prove the online mind answers before building the APK
        shell: bash
        env:
          BACKEND_URL: ${{ steps.deploy.outputs.backend_url }}
          SARAH_BACKEND_TOKEN: ${{ secrets.SARAH_MODEL_BACKEND_TOKEN || secrets.SARAH_ELEVENLABS_BACKEND_TOKEN }}
          SARAH_MODEL_PROVIDER: ${{ steps.config.outputs.provider }}
          SARAH_MODEL_ID: ${{ steps.config.outputs.model }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 3 \
            "$BACKEND_URL/health" > /tmp/sarah-health.json
          python - <<'PY'
          import json
          health = json.load(open('/tmp/sarah-health.json', encoding='utf-8'))
          if health.get('ok') is not True:
              raise SystemExit(f"Sarah backend health failed: {health}")
          if health.get('voice_ready') is not True:
              raise SystemExit(f"Sarah protected ElevenLabs voice is not ready: {health}")
          print('Sarah backend health passed.')
          PY

          python - <<'PY'
          import json, os
          request = {
              'provider': os.environ['SARAH_MODEL_PROVIDER'],
              'model': os.environ['SARAH_MODEL_ID'],
              'system_prompt': 'This is a deployment test. Reply with exactly ONLINE_READY and nothing else.',
              'history': [],
              'message': 'Reply with exactly ONLINE_READY.',
              'web_search': False,
          }
          json.dump(request, open('/tmp/sarah-smoke-request.json', 'w', encoding='utf-8'))
          PY
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer $SARAH_BACKEND_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/sarah-smoke-request.json \
            "$BACKEND_URL/" > /tmp/sarah-smoke-response.json
          python - <<'PY'
          import json, os
          response = json.load(open('/tmp/sarah-smoke-response.json', encoding='utf-8'))
          reply = str(response.get('reply') or '').strip()
          if reply != 'ONLINE_READY':
              raise SystemExit(f"Unexpected model smoke-test reply: {reply!r}")
          if response.get('provider') != os.environ['SARAH_MODEL_PROVIDER']:
              raise SystemExit(f"Provider mismatch: {response.get('provider')!r}")
          print('Live Sarah online-mind smoke test passed:', response.get('provider'), response.get('model'))
          PY

          python - <<'PY'
          import json
          json.dump({
              'text': 'Sarah voice is ready.',
              'voice_id': None,
          }, open('/tmp/sarah-voice-request.json', 'w', encoding='utf-8'))
          PY
          curl --fail --silent --show-error \
            -D /tmp/sarah-voice-headers.txt \
            -H "Authorization: Bearer $SARAH_BACKEND_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/sarah-voice-request.json \
            "$BACKEND_URL/voice" > /tmp/sarah-voice-smoke.mp3
          python - <<'PY'
          from pathlib import Path
          audio = Path('/tmp/sarah-voice-smoke.mp3')
          headers = Path('/tmp/sarah-voice-headers.txt').read_text(encoding='utf-8', errors='replace').lower()
          if audio.stat().st_size < 128:
              raise SystemExit('Protected ElevenLabs smoke response was too small to be audio.')
          if 'content-type: audio/' not in headers:
              raise SystemExit('Protected ElevenLabs smoke response did not identify audio content.')
          print('Protected ElevenLabs voice smoke test passed; bytes:', audio.stat().st_size)
          PY

      - name: Preserve Sarah private-test Android signing continuity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sarah-morgan-debug-signing-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build the online/offline judge APK
        env:
          SARAH_OPENAI_API_KEY: ''
          SARAH_ELEVENLABS_API_KEY: ''
          SARAH_MODEL_PROVIDER: ${{ steps.config.outputs.provider }}
          SARAH_MODEL_ID: ${{ steps.config.outputs.model }}
          SARAH_MODEL_BACKEND_URL: ${{ steps.deploy.outputs.backend_url }}
          SARAH_MODEL_BACKEND_TOKEN: ${{ secrets.SARAH_MODEL_BACKEND_TOKEN || secrets.SARAH_ELEVENLABS_BACKEND_TOKEN }}
          SARAH_ELEVENLABS_VOICE_ID: ${{ secrets.SARAH_ELEVENLABS_VOICE_ID || 'WcGvc9xxaOYbKswm3NBx' }}
          SARAH_ELEVENLABS_MODEL_ID: ${{ secrets.SARAH_ELEVENLABS_MODEL_ID || 'eleven_flash_v2_5' }}
          SARAH_ELEVENLABS_BACKEND_TOKEN: ${{ secrets.SARAH_MODEL_BACKEND_TOKEN || secrets.SARAH_ELEVENLABS_BACKEND_TOKEN }}
          SARAH_TAVILY_API_KEY: ''
          SARAH_STAY22_BACKEND_URL: ''
          SARAH_STAY22_BACKEND_TOKEN: ''
          SARAH_TRAVEL_COMMERCE_URL: ''
          SARAH_TRAVEL_COMMERCE_TOKEN: ''
          SARAH_VOICE_CONCIERGE_URL: ''
          SARAH_VOICE_CONCIERGE_TOKEN: ''
        run: |
          set -euo pipefail
          export SARAH_ELEVENLABS_BACKEND_URL="${SARAH_MODEL_BACKEND_URL%/}/voice"
          gradle -p Sarah_Morgan_Android_Phone_First_v3/android-app :app:assembleDebug --stacktrace
          cp Sarah_Morgan_Android_Phone_First_v3/android-app/app/build/outputs/apk/debug/app-debug.apk \
            Sarah-Morgan-2.5-ONLINE-JUDGE.apk
          test -s Sarah-Morgan-2.5-ONLINE-JUDGE.apk
          unzip -t Sarah-Morgan-2.5-ONLINE-JUDGE.apk >/dev/null
          if strings Sarah-Morgan-2.5-ONLINE-JUDGE.apk | grep -Eq '(sk[_-][A-Za-z0-9_-]{20,}|xi-[A-Za-z0-9_-]{20,}|tvly-[A-Za-z0-9_-]{20,}|OPENAI_API_KEY=|CLOUDFLARE_API_TOKEN=)'; then
            echo '::error::A provider credential-like value was found in the APK.'
            exit 1
          fi
          sha256sum Sarah-Morgan-2.5-ONLINE-JUDGE.apk | tee Sarah-Morgan-2.5-ONLINE-JUDGE.sha256

      - name: Record exactly what the judges' APK contains
        env:
          BACKEND_URL: ${{ steps.deploy.outputs.backend_url }}
          SARAH_MODEL_PROVIDER: ${{ steps.config.outputs.provider }}
          SARAH_MODEL_ID: ${{ steps.config.outputs.model }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          manifest = {
              'product': 'Sarah Morgan Travel OS',
              'version': '2.5-event-ready',
              'source_commit': os.environ['GITHUB_SHA'],
              'provider_requested_by_apk': os.environ['SARAH_MODEL_PROVIDER'],
              'model_requested_by_apk': os.environ['SARAH_MODEL_ID'],
              'backend_url': os.environ['BACKEND_URL'],
              'provider_key_embedded': False,
              'elevenlabs_key_embedded': False,
              'live_online_smoke_test': 'passed',
              'live_protected_elevenlabs_smoke_test': 'passed',
              'offline_fallback': 'included',
              'built_at_utc': datetime.now(timezone.utc).isoformat(),
              'note': 'The Worker provider/model may be changed server-side without rebuilding the APK.',
          }
          with open('Sarah-Morgan-2.5-ONLINE-JUDGE-manifest.json', 'w', encoding='utf-8') as handle:
              json.dump(manifest, handle, indent=2)
          PY

      - name: Upload the judge-ready APK only after the live model proof passes
        uses: actions/upload-artifact@v4
        with:
          name: Sarah-2.5-ONLINE-JUDGE-APK
          path: |
            Sarah-Morgan-2.5-ONLINE-JUDGE.apk
            Sarah-Morgan-2.5-ONLINE-JUDGE.sha256
            Sarah-Morgan-2.5-ONLINE-JUDGE-manifest.json
          if-no-files-found: error
          retention-days: 14

  build-tested-windows-event-installer:
    needs: deploy-smoke-test-and-build
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Check out the exact Sarah source
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows-companion/requirements.txt

      - name: Test Windows source without event credentials
        shell: pwsh
        working-directory: windows-companion
        env:
          SARAH_MODEL_BACKEND_URL: ''
          SARAH_MODEL_BACKEND_TOKEN: ''
          SARAH_ELEVENLABS_API_KEY: ''
          SARAH_ELEVENLABS_BACKEND_URL: ''
          SARAH_ELEVENLABS_BACKEND_TOKEN: ''
          SARAH_TAVILY_API_KEY: ''
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed.' }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Windows dependencies failed to install.' }
          python -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { throw 'Windows source tests failed.' }
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw 'Windows source compilation failed.' }
          python sarah_event_ready.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Source self-test failed.' }

      - name: Generate the event-only config and build the Windows installer
        shell: pwsh
        working-directory: windows-companion
        env:
          SARAH_MODEL_BACKEND_URL: ${{ needs.deploy-smoke-test-and-build.outputs.backend_url }}
          SARAH_MODEL_BACKEND_TOKEN: ${{ secrets.SARAH_MODEL_BACKEND_TOKEN || secrets.SARAH_ELEVENLABS_BACKEND_TOKEN }}
          SARAH_MODEL_PROVIDER: ${{ needs.deploy-smoke-test-and-build.outputs.model_provider }}
          SARAH_MODEL_ID: ${{ needs.deploy-smoke-test-and-build.outputs.model_id }}
          SARAH_ELEVENLABS_VOICE_ID: ${{ secrets.SARAH_ELEVENLABS_VOICE_ID || 'WcGvc9xxaOYbKswm3NBx' }}
          SARAH_ELEVENLABS_MODEL_ID: ${{ secrets.SARAH_ELEVENLABS_MODEL_ID || 'eleven_flash_v2_5' }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('SARAH_MODEL_BACKEND_URL', 'SARAH_MODEL_BACKEND_TOKEN', 'SARAH_MODEL_PROVIDER', 'SARAH_MODEL_ID', 'SARAH_ELEVENLABS_VOICE_ID')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required event build setting is absent: $name"
            }
          }
          $eventConfig = [ordered]@{
            SARAH_MODEL_BACKEND_URL = $env:SARAH_MODEL_BACKEND_URL
            SARAH_MODEL_BACKEND_TOKEN = $env:SARAH_MODEL_BACKEND_TOKEN
            SARAH_MODEL_PROVIDER = $env:SARAH_MODEL_PROVIDER
            SARAH_MODEL_ID = $env:SARAH_MODEL_ID
            SARAH_ELEVENLABS_VOICE_ID = $env:SARAH_ELEVENLABS_VOICE_ID
            SARAH_ELEVENLABS_MODEL_ID = $env:SARAH_ELEVENLABS_MODEL_ID
          }
          New-Item -ItemType Directory -Force -Path 'build' | Out-Null
          $eventConfigPath = (Resolve-Path 'build').Path + '\sarah-event-config.json'
          $eventConfig | ConvertTo-Json | Set-Content -LiteralPath $eventConfigPath -Encoding utf8NoBOM
          try {
            python -m PyInstaller --noconfirm --clean --onefile --windowed --name SarahTravelOS --add-data "$eventConfigPath;." --collect-all pystray --collect-all PIL --collect-all playsound3 --hidden-import googleapiclient.discovery --hidden-import google_auth_oauthlib.flow sarah_event_ready.py
            if ($LASTEXITCODE -ne 0) { throw 'Sarah application build failed.' }
          }
          finally {
            Remove-Item -LiteralPath $eventConfigPath -Force -ErrorAction SilentlyContinue
          }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SarahMorganTravelOS-Setup --add-binary 'dist\SarahTravelOS.exe;payload' sarah_installer.py
          if ($LASTEXITCODE -ne 0) { throw 'Sarah installer build failed.' }
          if (!(Test-Path 'dist\SarahMorganTravelOS-Setup.exe')) { throw 'Installer was not created.' }

      - name: Self-test the exact event installer
        shell: pwsh
        working-directory: windows-companion
        run: |
          $process = Start-Process -FilePath '.\dist\SarahMorganTravelOS-Setup.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer self-test returned $($process.ExitCode)." }
          $file = Get-Item '.\dist\SarahMorganTravelOS-Setup.exe'
          if ($file.Length -lt 1000000) { throw 'Installer is unexpectedly small.' }
          $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Not a PE executable.' }

      - name: Record the Windows event artifact without credentials
        shell: pwsh
        working-directory: windows-companion
        env:
          BACKEND_URL: ${{ needs.deploy-smoke-test-and-build.outputs.backend_url }}
          SARAH_MODEL_PROVIDER: ${{ needs.deploy-smoke-test-and-build.outputs.model_provider }}
          SARAH_MODEL_ID: ${{ needs.deploy-smoke-test-and-build.outputs.model_id }}
        run: |
          $file = Get-Item '.\dist\SarahMorganTravelOS-Setup.exe'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content -LiteralPath '.\dist\SarahMorganTravelOS-Setup.sha256' -Encoding ascii
          $manifest = [ordered]@{
            product = 'Sarah Morgan Travel OS'
            version = '2.5-event-ready'
            source_commit = $env:GITHUB_SHA
            provider_requested = $env:SARAH_MODEL_PROVIDER
            model_requested = $env:SARAH_MODEL_ID
            backend_url = $env:BACKEND_URL
            provider_key_embedded = $false
            elevenlabs_key_embedded = $false
            event_app_token_bundled = $true
            live_online_smoke_test = 'passed-before-windows-build'
            exact_installer_self_test = 'passed'
            token_rotation_required_after_event = $true
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath '.\dist\SarahMorganTravelOS-Setup-manifest.json' -Encoding utf8NoBOM

      - name: Upload the event Windows installer after all gates pass
        uses: actions/upload-artifact@v4
        with:
          name: Sarah-2.5-ONLINE-JUDGE-Windows-EXE
          path: |
            windows-companion/dist/SarahMorganTravelOS-Setup.exe
            windows-companion/dist/SarahMorganTravelOS-Setup.sha256
            windows-companion/dist/SarahMorganTravelOS-Setup-manifest.json
          if-no-files-found: error
          retention-days: 14
