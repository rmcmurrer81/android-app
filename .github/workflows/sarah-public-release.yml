name: Sarah 2.3 Public Release Pipeline

on:
  push:
    branches:
      - 'agent/sarah-public-*'
    paths:
      - 'public-release/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sarah-public-${{ github.ref }}
  cancel-in-progress: false

env:
  SARAH_OPENAI_API_KEY: ${{ secrets.SARAH_OPENAI_API_KEY }}
  SARAH_MODEL_BACKEND_URL: ${{ secrets.SARAH_MODEL_BACKEND_URL }}
  SARAH_MODEL_BACKEND_TOKEN: ${{ secrets.SARAH_MODEL_BACKEND_TOKEN }}
  SARAH_TRAVEL_COMMERCE_URL: ${{ secrets.SARAH_TRAVEL_COMMERCE_URL }}
  SARAH_TRAVEL_COMMERCE_TOKEN: ${{ secrets.SARAH_TRAVEL_COMMERCE_TOKEN }}
  SARAH_VOICE_CONCIERGE_URL: ${{ secrets.SARAH_VOICE_CONCIERGE_URL }}
  SARAH_VOICE_CONCIERGE_TOKEN: ${{ secrets.SARAH_VOICE_CONCIERGE_TOKEN }}
  SARAH_ELEVENLABS_API_KEY: ${{ secrets.SARAH_ELEVENLABS_API_KEY }}
  SARAH_ELEVENLABS_VOICE_ID: ${{ secrets.SARAH_ELEVENLABS_VOICE_ID }}
  SARAH_ELEVENLABS_MODEL_ID: ${{ secrets.SARAH_ELEVENLABS_MODEL_ID }}
  SARAH_ELEVENLABS_BACKEND_URL: ${{ secrets.SARAH_ELEVENLABS_BACKEND_URL }}
  SARAH_ELEVENLABS_BACKEND_TOKEN: ${{ secrets.SARAH_ELEVENLABS_BACKEND_TOKEN }}
  SARAH_TAVILY_API_KEY: ${{ secrets.SARAH_TAVILY_API_KEY }}
  SARAH_STAY22_API_KEY: ${{ secrets.SARAH_STAY22_API_KEY }}
  SARAH_STAY22_AID: ${{ secrets.SARAH_STAY22_AID }}

jobs:
  materialize-test-build-android:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
    steps:
      - name: Check out requested Sarah branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode and verify the complete public source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, shutil, zipfile

          encoded = Path('public-release/Sarah_Travel_OS_2.3_Public_Source.zip.b64')
          expected = Path('public-release/SOURCE_SHA256.txt').read_text(encoding='utf-8').split()[0]
          raw = base64.b64decode(encoded.read_text(encoding='ascii'))
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'Public source checksum mismatch: expected {expected}, got {actual}')
          archive = Path('/tmp/Sarah_Travel_OS_2.3_Public_Source.zip')
          archive.write_bytes(raw)
          target = Path('/tmp/sarah-public-source')
          shutil.rmtree(target, ignore_errors=True)
          target.mkdir(parents=True)
          with zipfile.ZipFile(archive) as package:
              package.extractall(target)
          status = json.loads((target / 'PUBLIC_RELEASE.json').read_text(encoding='utf-8'))
          if status.get('version') != '2.3-public-continuity':
              raise SystemExit('The source archive is not the expected Sarah 2.3 public release.')
          print(f'Verified {len(list(target.rglob("*")))} source entries; SHA-256 {actual}')
          PY

      - name: Materialize public phone and Windows source into GitHub
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=/tmp/sarah-public-source
          rm -rf windows-companion development-tools/sarah-2.3-android-upgrade docs/sarah-2.3
          cp -a "$SOURCE/windows-companion" ./windows-companion
          mkdir -p development-tools docs/sarah-2.3
          cp -a "$SOURCE/android-upgrade" development-tools/sarah-2.3-android-upgrade
          cp -a "$SOURCE/docs/." docs/sarah-2.3/
          mkdir -p docs/sarah-2.3/email
          cp -a "$SOURCE/email/." docs/sarah-2.3/email/
          cp "$SOURCE/README_FIRST.md" README_SARAH_2_3_PUBLIC.md
          cp "$SOURCE/PUBLIC_RELEASE.json" SARAH_PUBLIC_RELEASE.json
          cp "$SOURCE/windows-companion/github-workflows/build-windows-companion.yml" .github/workflows/build-windows-companion.yml
          python development-tools/sarah-2.3-android-upgrade/apply_android_upgrade.py "$GITHUB_WORKSPACE"
          rm -rf .sarah-upgrade-backup
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Run public Windows source tests on Linux
        working-directory: windows-companion
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q .

      - name: Run Android 2.3 pure-Java tests
        run: python development-tools/sarah-2.3-android-upgrade/run_android_upgrade_tests.py

      - name: Scan materialized source for committed credentials
        shell: bash
        run: |
          if grep -RniE --exclude='*.b64' --exclude-dir='.git' \
            '(sk-[A-Za-z0-9_-]{20,}|xi-api-key[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{16,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,})' \
            windows-companion development-tools/sarah-2.3-android-upgrade docs/sarah-2.3 Sarah_Morgan_Android_Phone_First_v3; then
            echo 'A credential-like value was found in Sarah source.'
            exit 1
          fi

      - name: Check that public users are not asked for provider keys
        shell: bash
        run: |
          if grep -RniE 'apiKeyInput|Personal connected-model API key|Enter your (OpenAI|Claude|Anthropic|ElevenLabs|Tavily) API key' \
            Sarah_Morgan_Android_Phone_First_v3/android-app/app/src/main windows-companion/sarah_core; then
            echo 'A forbidden public credential field was found.'
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Sarah Android 2.3 APK
        run: gradle -p Sarah_Morgan_Android_Phone_First_v3/android-app :app:assembleDebug --stacktrace

      - name: Name the Android artifact
        run: cp Sarah_Morgan_Android_Phone_First_v3/android-app/app/build/outputs/apk/debug/app-debug.apk Sarah-Morgan-2.3-public-continuity.apk

      - name: Commit the complete, readable public source to the branch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sarah Public Release Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No materialized source changes were needed.'
          else
            git commit -m 'Materialize Sarah 2.3 public phone and Windows source'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload Android public build
        uses: actions/upload-artifact@v4
        with:
          name: Sarah-Morgan-Android-2.3-Public
          path: Sarah-Morgan-2.3-public-continuity.apk
          if-no-files-found: error

  build-windows-installer:
    needs: materialize-test-build-android
    runs-on: windows-latest
    steps:
      - name: Check out the materialized public source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.materialize-test-build-android.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            windows-companion/requirements.txt
            windows-companion/requirements-build.txt

      - name: Install Windows build dependencies
        working-directory: windows-companion
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: Run Windows public-release tests
        working-directory: windows-companion
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q .

      - name: Build the single self-installing Sarah EXE
        working-directory: windows-companion
        run: python -m PyInstaller --noconfirm --clean SarahMorganWindows.spec

      - name: Verify the public installer file
        shell: pwsh
        run: |
          $file = 'windows-companion\dist\SarahMorganTravelOS-Setup.exe'
          if (!(Test-Path $file)) { throw 'SarahMorganTravelOS-Setup.exe was not created.' }
          Get-FileHash $file -Algorithm SHA256 | Format-List

      - name: Upload the one-file Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Sarah-Morgan-Windows-Public-Installer
          path: windows-companion/dist/SarahMorganTravelOS-Setup.exe
          if-no-files-found: error
