name: Sarah 2.5 Source Extraction Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'public-release/2.5/EXTRACT_REQUEST.json'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Sarah 2.5 repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/sarah-2.5-futuristic-sync
          fetch-depth: 0

      - name: Reconstruct and validate the complete Sarah 2.4 source archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find public-release/2.4/chunks -maxdepth 1 -type f -name 'chunk-*.txt' | sort)
          if [ "${#parts[@]}" -ne 3 ]; then
            echo "Expected exactly 3 complete-source chunks; found ${#parts[@]}."
            exit 1
          fi
          cat "${parts[@]}" > /tmp/sarah24-source.b64
          base64 --decode /tmp/sarah24-source.b64 > /tmp/Sarah_Travel_OS_2.4_Source.zip
          rm -rf extracted-source materialized-sarah24
          mkdir -p extracted-source materialized-sarah24
          unzip -q /tmp/Sarah_Travel_OS_2.4_Source.zip -d extracted-source
          test -d extracted-source/sarah24_source
          test -d extracted-source/sarah24_source/windows-companion
          test -f extracted-source/sarah24_source/windows-companion/SarahMorganInstaller.spec
          test -f extracted-source/sarah24_source/PUBLIC_RELEASE.json
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('extracted-source/sarah24_source')
          status = json.loads((root / 'PUBLIC_RELEASE.json').read_text(encoding='utf-8'))
          if status.get('version') != '2.4-stay22-live-public':
              raise SystemExit(f"Unexpected source version: {status.get('version')}")
          files = [p for p in root.rglob('*') if p.is_file()]
          print(f'Validated Sarah 2.4 source with {len(files)} files.')
          PY
          cp -a extracted-source/sarah24_source/. materialized-sarah24/
          find materialized-sarah24 -type d -name __pycache__ -prune -exec rm -rf {} +
          find materialized-sarah24 -type f -name '*.pyc' -delete

      - name: Commit the complete readable source to the repair branch
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sarah Source Extractor'
          git config user.email 'actions@users.noreply.github.com'
          git add materialized-sarah24
          if git diff --cached --quiet; then
            echo 'The readable Sarah 2.4 source is already materialized.'
          else
            git commit -m '[skip ci] Materialize readable Sarah 2.4 source for 2.5 repair'
            git push origin HEAD:agent/sarah-2.5-futuristic-sync
          fi

      - name: Upload the complete readable source for repair work
        uses: actions/upload-artifact@v4
        with:
          name: Sarah-2.4-Complete-Readable-Source
          path: materialized-sarah24
          if-no-files-found: error
          retention-days: 7
